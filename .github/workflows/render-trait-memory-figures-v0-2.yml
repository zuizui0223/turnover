name: Render trait-memory manuscript figures v0.2

on:
  pull_request:
    paths:
      - '.triggers/render-trait-memory-figures-v0-2'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/trait-memory-context-v0-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install figure runtime
        run: pip install matplotlib numpy
      - name: Validate canonical effect table
        run: |
          echo "5fffdfbc9ab50ff7bf568e80537a290e11c2bfde02f1d5484c7e896ed5f9415b  results/trait_memory_context_synthesis_v0_1/effects.csv" | sha256sum -c -
          test "$(wc -l < results/trait_memory_context_synthesis_v0_1/effects.csv)" -eq 202
      - name: Render descriptive manuscript figures
        run: |
          mkdir -p figures/trait_memory_context_v0_2
          python scripts/figures/render_trait_memory_context_v0_2.py \
            --effects results/trait_memory_context_synthesis_v0_1/effects.csv \
            --synthesis results/trait_memory_context_synthesis_v0_1/result.json \
            --out-dir figures/trait_memory_context_v0_2
          test -s figures/trait_memory_context_v0_2/figure2_memory_matrix.png
          test -s figures/trait_memory_context_v0_2/figure2_memory_matrix.pdf
          test -s figures/trait_memory_context_v0_2/figure4_backbone_sensitivity.png
          test -s figures/trait_memory_context_v0_2/figure4_backbone_sensitivity.pdf
      - name: Persist rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/trait_memory_context_v0_2/
          if git diff --cached --quiet; then
            echo "Figures already current."
          else
            git commit -m "Render trait-memory context figures v0.2"
            git push origin HEAD:manuscript/trait-memory-context-v0-2
          fi
