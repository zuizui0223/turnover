name: AusTraits organ-K coauthor review DOCX/PDF bundle v0.1

on:
  push:
    branches:
      - paper/austraits-organ-ecology-v0-2
    paths:
      - scripts/publication/build_austraits_organ_review_package_v0_1.py
      - scripts/publication/fix_austraits_review_docx_layout_v0_1.py
      - scripts/publication/render_austraits_supplement_docx_v0_1.py
      - docs/AUSTRAITS_K_ORGAN_ECOLOGY_MANUSCRIPT_V0_2.md
      - docs/AUSTRAITS_ORGAN_K_SUPPLEMENTARY_TABLES_V0_2.md
      - data/austraits_organ_paper_claim_registry_v0_2.json
      - scripts/analysis/render_austraits_organ_k_paper_figures_v0_2.py
      - scripts/publication/freeze_austraits_organ_aggregate_archives_v0_1.py
      - scripts/qa/audit_austraits_organ_lofo_accuracy_identity_v0_1.py
      - scripts/qa/validate_austraits_k_organ_paper_claims_v0_2.py
      - results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/**
      - .github/workflows/austraits-organ-coauthor-review-bundle-v0-1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coauthor-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document compilers and reference-style formatter
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc libreoffice-writer fonts-liberation poppler-utils >/dev/null
          python -m pip install --disable-pip-version-check python-docx==1.2.0 numpy matplotlib
      - name: Validate frozen aggregate SHA256 and regenerate figures without network source dependencies
        shell: bash
        run: |
          mkdir -p build/review_package/figures build/review_package/qa
          python scripts/publication/freeze_austraits_organ_aggregate_archives_v0_1.py \
            --inputs results/austraits_organ_paper_frozen_aggregate_inputs_v0_1
          python scripts/analysis/render_austraits_organ_k_paper_figures_v0_2.py \
            --module results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/reproductive_vegetative_lofo.json \
            --transition results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/nonflora_283_to_142_source_support_transition.json \
            --joint results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/joint_nonflora_shared_source_K.json \
            --claims data/austraits_organ_paper_claim_registry_v0_2.json \
            --out-dir build/review_package/figures
          test -s build/review_package/figures/figure1_common_tips_family_organK.png
          test -s build/review_package/figures/figure2_family_holdout_Brier.png
          test -s build/review_package/figures/figure3_taxon_vs_source_stages.png
          test -s build/review_package/figures/figure_manifest.json
      - name: Rebuild original reporting-only mathematical and manuscript QA from frozen counts
        shell: bash
        run: |
          mkdir -p build/review_package/qa/identity build/review_package/qa/claims
          python scripts/qa/audit_austraits_organ_lofo_accuracy_identity_v0_1.py \
            --claims data/austraits_organ_paper_claim_registry_v0_2.json \
            --output build/review_package/qa/identity/result.json \
            --self-test
          python scripts/qa/validate_austraits_k_organ_paper_claims_v0_2.py \
            --claims data/austraits_organ_paper_claim_registry_v0_2.json \
            --manuscript docs/AUSTRAITS_K_ORGAN_ECOLOGY_MANUSCRIPT_V0_2.md \
            --supplementary docs/AUSTRAITS_ORGAN_K_SUPPLEMENTARY_TABLES_V0_2.md \
            --output build/review_package/qa/claims/result.json \
            --self-test
          test "$(find build/review_package/qa -name result.json -type f | wc -l)" -eq 2
          grep -q 'PASS_HARD_ACCURACY_IS_ALGEBRAIC_REEXPRESSION' build/review_package/qa/identity/result.json
      - name: Compile paper/supplement source without changing biology
        shell: bash
        run: |
          python scripts/publication/build_austraits_organ_review_package_v0_1.py \
            --manuscript docs/AUSTRAITS_K_ORGAN_ECOLOGY_MANUSCRIPT_V0_2.md \
            --supplementary docs/AUSTRAITS_ORGAN_K_SUPPLEMENTARY_TABLES_V0_2.md \
            --figures build/review_package/figures \
            --out-dir build/review_package
          pandoc build/review_package/manuscript_review.md \
            --from markdown --to docx --standalone \
            --reference-doc build/review_package/reference_manuscript.docx \
            --resource-path build/review_package \
            --output build/review_package/organ_K_coauthor_manuscript.docx
          python scripts/publication/render_austraits_supplement_docx_v0_1.py \
            --markdown docs/AUSTRAITS_ORGAN_K_SUPPLEMENTARY_TABLES_V0_2.md \
            --manuscript docs/AUSTRAITS_K_ORGAN_ECOLOGY_MANUSCRIPT_V0_2.md \
            --brier-figure build/review_package/figures/figure2_family_holdout_Brier.png \
            --output build/review_package/organ_K_supplementary_tables.docx
      - name: Fix figure page breaks and landscape supplementary table widths
        run: |
          python scripts/publication/fix_austraits_review_docx_layout_v0_1.py \
            --manuscript build/review_package/organ_K_coauthor_manuscript.docx \
            --supplement build/review_package/organ_K_supplementary_tables.docx
      - name: Generate static PDF proofs from editable DOCX
        shell: bash
        run: |
          profile="file:///tmp/lo_organk_${GITHUB_RUN_ID}"
          libreoffice -env:UserInstallation="$profile" --headless \
            --convert-to pdf --outdir build/review_package \
            build/review_package/organ_K_coauthor_manuscript.docx \
            build/review_package/organ_K_supplementary_tables.docx
          test -s build/review_package/organ_K_coauthor_manuscript.pdf
          test -s build/review_package/organ_K_supplementary_tables.pdf
          test -s build/review_package/organ_K_coauthor_manuscript.docx
          test -s build/review_package/organ_K_supplementary_tables.docx
      - name: Verify math survived PDF conversion despite word-wrap
        shell: bash
        run: |
          pdftotext -layout build/review_package/organ_K_coauthor_manuscript.pdf \
            build/review_package/pdf_text_for_qa.txt
          pdftotext -layout build/review_package/organ_K_supplementary_tables.pdf \
            build/review_package/supp_text_for_qa.txt
          python - <<'PY'
          from pathlib import Path
          import re
          main = ' '.join(Path('build/review_package/pdf_text_for_qa.txt').read_text().split())
          supp = ' '.join(Path('build/review_package/supp_text_for_qa.txt').read_text().split())
          gate = main.partition('Consequently, the full-cohort')[2].partition('The coefficients')[0]
          if not gate:
              raise AssertionError('Main PDF lost Methods accuracy-identity location')
          for token in ('313', '314', '0.5', '354', '350', '760', '747',
                        '490/760', '489/747', '64.47%', '65.46%'):
              if token not in gate:
                  raise AssertionError('Main PDF Methods mathematical identity missing '+token)
          for token in ('490/760', '489/747', '64.47%', '65.46%'):
              if token not in supp:
                  raise AssertionError('Supplement PDF accuracy identity missing '+token)
          print('PDF_MATH_IDENTITY_RENDER_PASS: both S3/prune arithmetic equations legible')
          PY
      - name: Create long-lived reviewer artifact with source fingerprint
        shell: bash
        run: |
          cd build/review_package
          zip -q -r ../austraits_organ_K_coauthor_review_v0_1.zip \
            organ_K_coauthor_manuscript.docx organ_K_coauthor_manuscript.pdf \
            organ_K_supplementary_tables.docx organ_K_supplementary_tables.pdf \
            README.txt source_manifest.json figures/ qa/
          test -s ../austraits_organ_K_coauthor_review_v0_1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-organ-K-coauthor-review-v0-1
          path: build/austraits_organ_K_coauthor_review_v0_1.zip
          retention-days: 90
          if-no-files-found: error
