name: BIODEPTH GIFT 3.1 maximum height source-reference coverage gate
on:
  push:
    branches: [analysis/biodepth-2010-species-pool-audit-20261115]
    paths:
      - scripts/analysis/audit_biodepth_gift_height_references_v0_1.py
      - .github/workflows/biodepth-gift-height-reference-gate-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/audit_biodepth_gift_height_references_v0_1.py
      - .github/workflows/biodepth-gift-height-reference-gate-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Audit no-outcome source and reference parsing fixture
        run: |
          python3 -m py_compile scripts/analysis/audit_biodepth_gift_height_references_v0_1.py
          python3 scripts/analysis/audit_biodepth_gift_height_references_v0_1.py --self-test
      - name: Acquire byte-pinned original 2010 BIODEPTH source planted species roster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib
          src={
            "Species2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesBiomass.txt",
               "ebe677c639ef4603bc1ed50d49e7440588683e7696be230c0cbfff7d6b22b816"),
            "Codes2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesCodes.txt",
               "02ad483f727d4d10c10be7e7fe83e9e66c42803d6d08956d9397001dbf32f11b")}
          folder=Path("/tmp/original_biodepth_species_for_gift");folder.mkdir(parents=True,exist_ok=True)
          for name,(url,sha) in src.items():
            with urlopen(Request(url,headers={"User-Agent":"turnover-BIODEPTH-GIFT-bibliography-gate/0.1"}),timeout=100) as res:
              raw=res.read(1000000)
            if hashlib.sha256(raw).hexdigest()!=sha:raise ValueError("Hector 2010 original source SHA changed: "+name)
            (folder/name).write_bytes(raw)
            print("ORIGINAL_2010_SOURCE_SHA256_PASS",name,len(raw),sha)
          PY
      - name: Audit 103 original taxa exact GIFT height references and source-qualified plot support
        run: |
          python3 scripts/analysis/audit_biodepth_gift_height_references_v0_1.py \
            --species /tmp/original_biodepth_species_for_gift/Species2010.txt \
            --codes /tmp/original_biodepth_species_for_gift/Codes2010.txt \
            --out results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json
      - name: Save only source bibliographic summary and conservative eligibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biodepth-gift31-103taxa-height-bibliographic-gate-v0-1
          path: results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json
          if-no-files-found: ignore
          retention-days: 30
