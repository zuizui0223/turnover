name: BIODEPTH original 2010 botanical-source Origanum 13m quality correction sensitivity
on:
  push:
    branches: [analysis/biodepth-2010-species-pool-audit-20261115]
    paths:
      - scripts/analysis/fit_biodepth_2010_origanum_height_botanical_correction_v0_1.py
      - .github/workflows/biodepth-2010-origanum-height-source-correction-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/fit_biodepth_2010_origanum_height_botanical_correction_v0_1.py
      - .github/workflows/biodepth-2010-origanum-height-source-correction-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-frozen-plus-posthoc-botanical-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original numerical environment and check source-based correction fixture
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.3.4
          python3 -m py_compile scripts/analysis/fit_biodepth_2010_origanum_height_botanical_correction_v0_1.py
          python3 scripts/analysis/fit_biodepth_2010_origanum_height_botanical_correction_v0_1.py --self-test
      - name: Verify original published GIFT 13m and external botanist correction have source audit manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("results/biodepth_2010_species_source_v0_1")
          m=json.loads((base/"gift_origanum_maxheight_anomaly_source_summary_v0_1.json").read_text())
          g=json.loads((base/"gift_height_103taxa_bibliography_qa_v0_1.json").read_text())
          p=json.loads((base/"height_pairwise_dispersion_biomass_site_holdout_v0_1.json").read_text())
          if (m["original_GIFT_aggregate_max_height_m"]!=13
              or m["raw_reference_1997_13m_ref_ID"]!=263
              or m["external_Kew_upper_height_m"]!=.9
              or g["status"]!="GIFT_HEIGHT_REFERENCE_PROVENANCE_PASS"
              or p["population"]["provenance_quality_eligible_plots"]!=174):
              raise ValueError("Not the previous source-pinned original anomaly and heldout corpus")
          print("SOURCE_ONLY_BOTANICAL_HEIGHT_ALTERNATIVE_VERIFIED",
                "GIFT_original_13m","Kew_0.9m","Pladias_0.7m","RHS_1.0m")
          PY
      - name: Re-fetch immutable original 2010 Species and Community and original 2005 planted design
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          root=Path("/tmp/BIODEPTH_original_height_botanical_correction")
          root.mkdir(parents=True,exist_ok=True)
          sources={
            "Species2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesBiomass.txt",
               "ebe677c639ef4603bc1ed50d49e7440588683e7696be230c0cbfff7d6b22b816"),
            "Codes2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesCodes.txt",
               "02ad483f727d4d10c10be7e7fe83e9e66c42803d6d08956d9397001dbf32f11b"),
            "Community2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthBiomass.txt",
               "9d95e65295bf6014e753f474dffa09036718b6b54ad5e1d4eea41c1dde76f886"),
            "Design2005.txt":("https://ndownloader.figshare.com/files/5640240",
               "a3029e18937b577aa2dafd9efb31fc50bf8fa39a0c1b48bca7c493cc6013cc7a")}
          for name,(url,sha) in sources.items():
            r=urllib.request.Request(url,headers={"User-Agent":"turnover-BIODEPTH-Origanum-height-physical-source-QA/0.1"})
            with urllib.request.urlopen(r,timeout=110) as res:raw=res.read(2_000_001)
            if len(raw)>2_000_000 or hashlib.sha256(raw).hexdigest()!=sha:
                raise ValueError("Original community/scientific source SHA changed")
            (root/name).write_bytes(raw)
            print("ORIGINAL_SOURCE_SHA_PASS",name,len(raw),sha)
          PY
      - name: Repeat frozen seven-site GIFT 13m source control and report three independent botanical corrected height interpretations
        run: |
          python3 scripts/analysis/fit_biodepth_2010_origanum_height_botanical_correction_v0_1.py \
            --species /tmp/BIODEPTH_original_height_botanical_correction/Species2010.txt \
            --codes /tmp/BIODEPTH_original_height_botanical_correction/Codes2010.txt \
            --design /tmp/BIODEPTH_original_height_botanical_correction/Design2005.txt \
            --community /tmp/BIODEPTH_original_height_botanical_correction/Community2010.txt \
            --provenance results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json \
            --anomaly results/biodepth_2010_species_source_v0_1/gift_origanum_maxheight_anomaly_source_summary_v0_1.json \
            --prior results/biodepth_2010_species_source_v0_1/height_pairwise_dispersion_biomass_site_holdout_v0_1.json \
            --out results/biodepth_2010_species_source_v0_1/origanum_botanical_height_source_correction_v0_1.json
      - name: Archive only aggregated corrected source scenario model effects and original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biodepth-2010-heightFD-origanum-GIFT13m-Kew09-Pladias07-RHS1-source-sensitivity
          path: results/biodepth_2010_species_source_v0_1/origanum_botanical_height_source_correction_v0_1.json
          if-no-files-found: ignore
          retention-days: 30
