name: AusTraits memory semantic validity v0.3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install duckdb pyyaml
      - name: Download frozen structural support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/support
          gh run download 37113526646 -R "$GITHUB_REPOSITORY" -n austraits-memory-temporal-support-v0-2 -D build/support
          test -f build/support/family_trait_support.csv
      - name: Download exact AusTraits source
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 -o build/source/austraits.parquet             https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail -o build/source/traits.yml             https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Validate semantic contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/austraits_memory_semantic_v0_3.json'))
          s=json.load(open('results/austraits_memory_temporal_support_v0_2/result.json'))
          assert d['status']=='FROZEN_BEFORE_AUSTRAITS_TEMPORAL_MEMORY_EFFECT_OPENING'
          assert d['record_identity']=='dataset_id + ASCII unit-separator + observation_id; rows are deduplicated at record_key x trait x value before species-state aggregation.'
          assert s['status']=='AUSTRAITS_MEMORY_TEMPORAL_SUPPORT_PASS'
          assert s['n_structural_pass_systems']==4833
          assert d['austraits_memory_effects_opened'] is False
          PY
      - name: Run source-native semantic validity
        run: |
          mkdir -p build/austraits_memory_semantic_v0_3
          python scripts/source/audit_austraits_memory_semantic_v0_3.py             --parquet build/source/austraits.parquet             --traits-yml build/source/traits.yml             --support-table build/support/family_trait_support.csv             --out build/austraits_memory_semantic_v0_3/result.json             --table-out build/austraits_memory_semantic_v0_3/semantic.csv
      - name: Enforce outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/austraits_memory_semantic_v0_3/result.json'))
          assert x['outcome_blind'] is True
          assert x['austraits_memory_effects_opened'] is False
          assert x['status'] in {'AUSTRAITS_MEMORY_SEMANTIC_PASS','HOLD_AUSTRAITS_MEMORY_SEMANTIC'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-memory-semantic-v0-3
          path: build/austraits_memory_semantic_v0_3/
