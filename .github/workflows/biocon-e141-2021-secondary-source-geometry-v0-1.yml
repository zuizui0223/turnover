name: BioCON 2021 secondary SLA fixed source geometry before outcomes
on:
  push:
    branches:
      - analysis/biocon-e141-2021-secondary-sla-fd-nde-v0-1
    paths:
      - scripts/source/audit_biocon_e141_2021_secondary_SLA_geometry_v0_1.py
      - .github/workflows/biocon-e141-2021-secondary-source-geometry-v0-1.yml
  pull_request:
    paths:
      - scripts/source/audit_biocon_e141_2021_secondary_SLA_geometry_v0_1.py
      - .github/workflows/biocon-e141-2021-secondary-source-geometry-v0-1.yml
  workflow_dispatch:
jobs:
  source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geometry dependency
        run: python -m pip install numpy==2.1.3
      - name: Synthetic rank/gitrevision fixture
        run: python scripts/source/audit_biocon_e141_2021_secondary_SLA_geometry_v0_1.py --selftest
      - name: Check immutable author SLA and source-only full holdout ranks
        run: python scripts/source/audit_biocon_e141_2021_secondary_SLA_geometry_v0_1.py --source
      - name: Upload source-only design verdict
        uses: actions/upload-artifact@v4
        with:
          name: biocon-e141-2021-secondary-sla-geometry-nonraw
          path: results/biocon_e141_2021_secondary_sla_source_geometry_20261124_v0_1.json
          if-no-files-found: error
          retention-days: 60
