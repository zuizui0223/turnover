name: Trait memory cluster bootstrap diagnostic v0.3

on:
  push:
    branches:
      - analysis/trait-memory-robustness-v0-3-model-fix
    paths:
      - '.github/workflows/trait-memory-cluster-bootstrap-diagnostic-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download passed aggregate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/robust
          gh run download 37271779078 -R "$GITHUB_REPOSITORY" -n trait-memory-robust-effects-v0-3-recovered -D build/robust
          test -f build/robust/effects_with_se_log.csv
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
            any::metafor
      - name: Reproduce first frozen cluster-bootstrap replicate
        run: |
          Rscript scripts/analysis/diagnose_trait_memory_cluster_bootstrap_v0_3.R \
            --effects build/robust/effects_with_se_log.csv
