name: Verify GIFT 3.1 taxonomy and plant trait metadata API linkage feasibility v0.1
on:
  push:
    branches: [paper/austraits-organ-ecology-v0-2]
    paths:
      - .github/workflows/austraits-organ-gift-v7-linkage-feasibility-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-public-gift-api-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version-pinned public GIFT species and traits metadata API
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          base="https://gift.uni-goettingen.de/api/extended/index3.1.php"
          urls={
           "species_paged":base+"?"+urllib.parse.urlencode({"query":"species","startat":0,"limit":5}),
           "traits_meta":base+"?"+urllib.parse.urlencode({"query":"traits_meta"}),
           "lookup_species":base+"?"+urllib.parse.urlencode({"query":"names_matched_unique","genus":"Acacia","epithet":"dealbata"}),
           "growth_form":base+"?"+urllib.parse.urlencode({"query":"traits","traitid":"1.2.1","biasref":0,"biasderiv":0,"startat":0,"limit":5}),
          }
          result={"requested_version":"3.1","public_GIFT_API":"https://gift.uni-goettingen.de/api/extended/index3.1.php",
                  "requests":{},"historical_AusTraits_species_coverage_not_yet_measured":True}
          for key,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"turnover-original-austraits-source-GIFT-methods-review/0.1","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=45) as f:
                      raw=f.read(2*1024*1024)
                      mime=f.headers.get('Content-Type','')
                      code=f.status
                  data=json.loads(raw)
                  obj={"http_status":code,"content_type":mime,"json_type":type(data).__name__,"bytes_returned":len(raw)}
                  obj["root_keys"]=list(data.keys())[:20] if isinstance(data,dict) else []
                  obj["n_top_level_rows"]=len(data) if isinstance(data,(dict,list)) else None
                  if isinstance(data,list) and data and isinstance(data[0],dict):
                      obj["row_columns"]=list(data[0].keys())[:35]
                  if isinstance(data,dict):
                      for v in data.values():
                          if isinstance(v,list) and v and isinstance(v[0],dict):
                              obj["nested_row_columns"]=list(v[0].keys())[:35]
                              break
                  result["requests"][key]=obj
              except Exception as e:
                  result["requests"][key]={"error_class":type(e).__name__,"error_detail":str(e)[:220]}
          print("PUBLIC_GIFT_3_1_API_LINKAGE_RESULT",json.dumps(result,ensure_ascii=False,sort_keys=True))
          # Genuine diagnostic, not false claim of integration or trait matching.
          if not any("http_status" in z for z in result["requests"].values()):
              print("GIFT_PUBLIC_API_CURRENTLY_NOT_REACHABLE_FROM_RUNNER")
          else:
              print("GIFT_PUBLIC_API_AT_LEAST_ONE_QUERY_REACHABLE")
          PY
