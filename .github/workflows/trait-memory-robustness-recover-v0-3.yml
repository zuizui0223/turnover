name: Trait memory robustness v0.3 recover

on:
  push:
    branches:
      - analysis/trait-memory-robustness-v0-3-model-fix
    paths:
      - '.github/workflows/trait-memory-robustness-recover-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate technical-only recovery contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_robustness_design_v0_3.json'))
          assert d['status']=='FROZEN_BEFORE_TRAIT_MEMORY_ROBUSTNESS_OUTCOMES'
          assert d['technical_amendment_aggregate_runtime']['before_aggregate_outcome_opening'] is True
          assert d['technical_amendment_aggregate_runtime']['scientific_change'] is False
          assert d['technical_amendment_cluster_bootstrap_lookup']['before_model_execution'] is True
          assert d['technical_amendment_cluster_bootstrap_lookup']['scientific_change'] is False
          PY
      - name: Download completed 32-batch source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/download build/all-effects build/core build/reference
          gh run download 37269950030 -R "$GITHUB_REPOSITORY" -p 'trait-memory-robust-batch-R*' -D build/download
          find build/download -type f -name '*.json' -exec cp {} build/all-effects/ \;
          test "$(find build/all-effects -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 201
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          gh run download 37095981751 -R "$GITHUB_REPOSITORY" -n trait-memory-repeatability-real-effects-batched-v0-2-1 -D build/reference
          test "$(sha256sum build/reference/effects.csv | awk '{print $1}')" = "5fffdfbc9ab50ff7bf568e80537a290e11c2bfde02f1d5484c7e896ed5f9415b"
      - name: Run reference identity and SE validity gate
        run: |
          mkdir -p build/robust
          python -m py_compile scripts/analysis/aggregate_trait_memory_robust_v0_3.py
          python scripts/analysis/aggregate_trait_memory_robust_v0_3.py \
            --input-dir build/all-effects \
            --reference-effects build/reference/effects.csv \
            --core-table build/core/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out-csv build/robust/effects_with_se_log.csv \
            --out-json build/robust/aggregate_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-robust-effects-v0-3-recovered
          path: build/robust/
          retention-days: 30

  model:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trait-memory-robust-effects-v0-3-recovered
          path: build/robust
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
            any::metafor
            any::Matrix
            any::MASS
      - name: Parse downstream R scripts
        run: |
          Rscript -e "parse(file='scripts/analysis/fit_trait_memory_measurement_aware_v0_3.R'); parse(file='scripts/analysis/test_trait_memory_portability_blup_v0_3.R'); parse(file='scripts/analysis/test_trait_memory_correlated_trait_null_v0_3.R')"
      - name: Fit measurement-aware crossed model
        run: |
          mkdir -p build/model
          Rscript scripts/analysis/fit_trait_memory_measurement_aware_v0_3.R \
            --effects build/robust/effects_with_se_log.csv \
            --aggregate-json build/robust/aggregate_result.json \
            --out build/model/measurement_aware_result.json \
            --bootstrap-table build/model/measurement_aware_cluster_bootstrap.csv
      - name: Test BLUP portability sensitivity
        run: |
          Rscript scripts/analysis/test_trait_memory_portability_blup_v0_3.R \
            --effects build/robust/effects_with_se_log.csv \
            --aggregate-json build/robust/aggregate_result.json \
            --out build/model/blup_portability_result.json \
            --predictions build/model/blup_portability_predictions.csv
      - name: Test correlated-trait zero-family null
        run: |
          Rscript scripts/analysis/test_trait_memory_correlated_trait_null_v0_3.R \
            --effects build/robust/effects_with_se_log.csv \
            --aggregate-json build/robust/aggregate_result.json \
            --out build/model/correlated_trait_null_result.json \
            --null-table build/model/correlated_trait_null.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-robustness-v0-3-recovered
          path: |
            build/robust/
            build/model/
          retention-days: 30
