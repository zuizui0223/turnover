name: BIEN trait support v0.2

on:
  pull_request:
    paths:
      - 'data/bien_trait_support_design_v0_2.json'
      - 'data/bien_trait_support_amendment_v0_2_1.json'
      - 'data/bien_trait_support_firewall_fix_v0_2_2.json'
      - 'results/bien_metadata_preflight_v0_1/result_pass_v0_1_2.json'
      - 'scripts/source/audit_bien_trait_support_v0_2.R'
      - '.github/workflows/bien-trait-support-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite

      - name: Pin RBIEN source implementation
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          test "$(grep '^Version:' build/RBIEN/DESCRIPTION | awk '{print $2}')" = "1.2.9"

      - name: Validate frozen support contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/bien_trait_support_design_v0_2.json'))
          p=json.load(open('results/bien_metadata_preflight_v0_1/result_pass_v0_1_2.json'))
          assert p['status']=='BIEN_METADATA_PREFLIGHT_PASS'
          assert p['observed_database_version']=='4.2.8'
          assert p['generalized_trait_values_opened'] is False
          assert d['status']=='FROZEN_BEFORE_BIEN_TRAIT_SUPPORT_COUNTING'
          assert d['source']['exact_patch_pin']=='4.2.8'
          assert d['temporal_support']['minimum_species_per_family_trait']==20
          assert d['spatial_support']['minimum_georeferenced_records_per_species']==20
          assert d['spatial_support']['minimum_cells_per_species']==5
          assert d['spatial_support']['minimum_spatial_species_per_family_trait']==8
          assert d['joint_gate']['minimum_independent_families']==12
          assert d['generalized_trait_values_opened'] is False
          assert d['biological_turnover_outcomes_opened'] is False
          a=json.load(open('data/bien_trait_support_amendment_v0_2_1.json'))
          assert a['status']=='TRAIT_VALUE_PRESENCE_FILTER_ADDED_PRE_SUPPORT_RESULT'
          assert a['stricter_only'] is True
          assert a['chronology']['support_result_seen_before_fix'] is False
          assert a['can_rescue_failure'] is False
          assert a['can_increase_support_counts'] is False
          assert d['record_filter']['require_nonmissing_trait_value'] is True
          f=json.load(open('data/bien_trait_support_firewall_fix_v0_2_2.json'))
          assert f['status']=='TRAIT_VALUE_FIREWALL_FALSE_POSITIVE_FIXED_PRE_SUPPORT_RESULT'
          assert f['trigger']['support_result_seen_before_fix'] is False
          assert f['biological_rules_changed'] is False
          assert f['thresholds_changed'] is False
          PY

      - name: Run aggregate-only support audit
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          mkdir -p build/bien_trait_support_v0_2
          Rscript scripts/source/audit_bien_trait_support_v0_2.R \
            --out build/bien_trait_support_v0_2/result.json \
            --table-out build/bien_trait_support_v0_2/family_trait_support.csv

      - name: Enforce value firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/bien_trait_support_v0_2/result.json'))
          assert x['outcome_blind'] is True
          assert x['generalized_trait_values_opened'] is False
          assert x['biological_turnover_outcomes_opened'] is False
          assert x['version']=='v0.2.2'
          assert x['trait_value_presence_only'] is True
          assert x['trait_value_returned'] is False
          assert x['row_level_species_returned'] is False
          assert x['row_level_coordinates_returned'] is False
          assert x['status'] in {'BIEN_TRAIT_SUPPORT_PASS','HOLD_BIEN_TRAIT_SUPPORT','HOLD_BIEN_PATCH_CHANGED_BEFORE_SUPPORT'}
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bien-trait-support-v0-2
          path: |
            build/bien_trait_support_v0_2/result.json
            build/bien_trait_support_v0_2/family_trait_support.csv
