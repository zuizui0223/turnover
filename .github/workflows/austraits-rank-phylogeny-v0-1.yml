name: Exploratory AusTraits trait-rank deep phylogeny v0.1
on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-rank-phylogeny-v0-1.yml'
      - 'data/austraits_rank_phylogeny_design_v0_1.json'
      - 'scripts/analysis/build_generic_family_phylogeny_v0_1.R'
      - 'scripts/analysis/test_austraits_rank_phylogeny_v0_1.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen AusTraits real effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/effects
          gh run download 37561484157 -R "$GITHUB_REPOSITORY" -n austraits-real-effects-v0-1 -D build/effects
          test -f build/effects/effects.csv
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ape
      - name: Pin V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Build full-backbone family distances
        run: |
          mkdir -p build/phy
          Rscript scripts/analysis/build_generic_family_phylogeny_v0_1.R \
            --effects build/effects/effects.csv --reps-out build/phy/family_representatives.csv \
            --dist-out build/phy/family_distances.csv --result build/phy/coverage.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy
      - name: Test deep-phylogenetic organization
        run: |
          mkdir -p build/result
          python scripts/analysis/test_austraits_rank_phylogeny_v0_1.py \
            --effects build/effects/effects.csv --distances build/phy/family_distances.csv \
            --out build/result/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-rank-phylogeny-v0-1
          path: |
            build/result/result.json
            build/phy/coverage.json
            build/phy/family_representatives.csv
            build/phy/family_distances.csv
          retention-days: 30
