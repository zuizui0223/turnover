name: Trait memory component detectability v0.6.2
on:
  pull_request:
    paths:
      - '.triggers/trait-memory-component-detectability-v0-6-2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  component-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
      - name: Download frozen final crossed core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/final-core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/final-core
          test -f build/final-core/trait_memory_crossed_core_v0_6/core_systems.csv
      - name: Run independent component detectability
        run: |
          mkdir -p build/component-info
          Rscript scripts/analysis/run_trait_memory_component_detectability_v0_6_2.R \
            --core-table build/final-core/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/component-info/result.json \
            --table-out build/component-info/simulations.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-component-detectability-v0-6-2
          path: build/component-info/
