name: BioCON 2021 source-only FD predictor redundancy and leverage QA
on:
  push:
    branches:
      - audit/biocon-e141-2021-fd-predictor-identifiability-20261124
    paths:
      - scripts/audit/biocon_e141_2021_source_FD_geometry_diagnostic_v0_1.py
      - docs/BIOCON_E141_2021_FD_PREDICTOR_IDENTIFIABILITY_FROZEN_20261124.md
      - .github/workflows/biocon-e141-2021-source-predictor-identifiability-v0-1.yml
  pull_request:
    paths:
      - scripts/audit/biocon_e141_2021_source_FD_geometry_diagnostic_v0_1.py
      - docs/BIOCON_E141_2021_FD_PREDICTOR_IDENTIFIABILITY_FROZEN_20261124.md
      - .github/workflows/biocon-e141-2021-source-predictor-identifiability-v0-1.yml
  workflow_dispatch:
jobs:
  source-geometry-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical geometry dependency
        run: python -m pip install numpy==2.1.3
      - name: Synthetic source-only leverage geometry fixture
        run: python scripts/audit/biocon_e141_2021_source_FD_geometry_diagnostic_v0_1.py --selftest
      - name: Diagnose original 46-composition source FD and M0/M1 leverage without outcomes
        run: python scripts/audit/biocon_e141_2021_source_FD_geometry_diagnostic_v0_1.py --source
      - name: Keep aggregate-only original predictor geometry
        uses: actions/upload-artifact@v4
        with:
          name: biocon-e141-2021-source-FD-leverage-vif-nonraw
          path: results/biocon_e141_2021_secondary_SLA_predictor_identifiability_v0_1.json
          if-no-files-found: error
          retention-days: 60
