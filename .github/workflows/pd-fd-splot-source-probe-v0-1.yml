name: sPlotOpen pinned public archive schema probe v0.1
on:
  push:
    branches: [analysis/pd-fd-biomass-source-gate-20261114]
    paths:
      - scripts/analysis/probe_splotopen_source_v0_1.py
      - .github/workflows/pd-fd-splot-source-probe-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/probe_splotopen_source_v0_1.py
      - .github/workflows/pd-fd-splot-source-probe-v0-1.yml
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive probe on synthetic zip (no biological results)
        run: |
          python3 -m py_compile scripts/analysis/probe_splotopen_source_v0_1.py
          python3 scripts/analysis/probe_splotopen_source_v0_1.py --self-test
      - name: Download pinned public sPlotOpen source ZIP 3474 version 5047
        run: |
          curl --fail --show-error --silent --location --retry 1 --connect-timeout 30 --max-time 480 \
            'https://idata.idiv.de/ddm/Data/DownloadZip/3474?version=5047' -o /tmp/splotopen_version5047.zip
      - name: Verify real public archive identities and table schemas (no effects)
        run: |
          python3 scripts/analysis/probe_splotopen_source_v0_1.py \
            --archive /tmp/splotopen_version5047.zip --out source_probe_summary.json
      - name: Preserve only nonraw source gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-fd-splotopen-source-probe-v0-1
          path: source_probe_summary.json
          if-no-files-found: ignore
          retention-days: 14
