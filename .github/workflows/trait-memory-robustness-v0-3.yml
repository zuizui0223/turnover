name: Trait memory robustness v0.3

on:
  push:
    branches:
      - analysis/trait-memory-robustness-v0-3
    paths:
      - '.github/workflows/trait-memory-robustness-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen robustness design
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_robustness_design_v0_3.json'))
          assert d['status']=='FROZEN_BEFORE_TRAIT_MEMORY_ROBUSTNESS_OUTCOMES'
          assert d['population']['n_systems']==201
          assert d['measurement_error']['replicates']==199
          assert d['measurement_error']['uncertainty']['replicates']==500
          assert d['correlated_trait_family_null']['simulation']['replicates']==1000
          assert d['relationship_to_original']['original_repeatability']=='results/trait_memory_repeatability_v0_2/result.json'
          assert d['technical_amendment']['before_robustness_execution'] is True
          assert d['technical_amendment_correlated_null']['before_null_execution'] is True
          PY
      - name: Download frozen core and archived effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core build/reference
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          gh run download 37095981751 -R "$GITHUB_REPOSITORY" -n trait-memory-repeatability-real-effects-batched-v0-2-1 -D build/reference
          test -f build/core/trait_memory_crossed_core_v0_6/core_systems.csv
          test -f build/reference/effects.csv
          sha256sum build/reference/effects.csv
          test "$(sha256sum build/reference/effects.csv | awk '{print $1}')" = "5fffdfbc9ab50ff7bf568e80537a290e11c2bfde02f1d5484c7e896ed5f9415b"
      - id: matrix
        run: |
          python - <<'PY'
          import base64,csv,json,os
          rows=list(csv.DictReader(open('build/core/trait_memory_crossed_core_v0_6/core_systems.csv',newline='')))
          assert len(rows)==201
          assert {r['semantic_class'] for r in rows}=={'continuous_scalar'}
          systems=[]
          for i,r in enumerate(rows,1):
              systems.append({
                'id':f'Q{i:04d}',
                'family':r['family'],
                'trait_name':r['trait_name'],
                'weight':int(r['n_input_species'])**2
              })
          bins=[{'weight':0,'systems':[]} for _ in range(32)]
          for s in sorted(systems,key=lambda z:(-z['weight'],z['family'],z['trait_name'])):
              k=min(range(32),key=lambda i:(bins[i]['weight'],i))
              bins[k]['systems'].append({q:s[q] for q in ['id','family','trait_name']})
              bins[k]['weight']+=s['weight']
          include=[]
          for i,b in enumerate(bins,1):
              raw=json.dumps(b['systems'],separators=(',',':')).encode()
              include.append({
                'batch_id':f'R{i:03d}',
                'systems_b64':base64.b64encode(raw).decode(),
                'n_systems':len(b['systems']),
                'weight':b['weight']
              })
          assert sum(x['n_systems'] for x in include)==201
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          PY

  effect-batch:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Download frozen final core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          mkdir -p results/trait_memory_crossed_core_v0_6
          cp build/core/trait_memory_crossed_core_v0_6/core_systems.csv results/trait_memory_crossed_core_v0_6/core_systems.csv
          cp build/core/trait_memory_crossed_core_v0_6/result.json results/trait_memory_crossed_core_v0_6/result.json
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Decode batch
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/effects
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
      - name: Run species-bootstrap and log sensitivity
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          python -m py_compile             scripts/analysis/run_trait_memory_robust_batch_v0_3.py             scripts/analysis/aggregate_trait_memory_robust_v0_3.py
          python scripts/analysis/run_trait_memory_robust_batch_v0_3.py             --batch-json build/batch/systems.json             --out-dir build/effects
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-robust-batch-${{ matrix.batch_id }}
          path: build/effects/*.json
          retention-days: 30

  aggregate:
    needs: effect-batch
    if: always() && needs.effect-batch.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trait-memory-robust-batch-R*
          path: build/all-effects
          merge-multiple: true
      - name: Download frozen core and archived reference effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core build/reference
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          gh run download 37095981751 -R "$GITHUB_REPOSITORY" -n trait-memory-repeatability-real-effects-batched-v0-2-1 -D build/reference
          test "$(sha256sum build/reference/effects.csv | awk '{print $1}')" = "5fffdfbc9ab50ff7bf568e80537a290e11c2bfde02f1d5484c7e896ed5f9415b"
      - name: Aggregate behind reference identity gate
        run: |
          mkdir -p build/robust
          python scripts/analysis/aggregate_trait_memory_robust_v0_3.py             --input-dir build/all-effects             --reference-effects build/reference/effects.csv             --core-table build/core/trait_memory_crossed_core_v0_6/core_systems.csv             --out-csv build/robust/effects_with_se_log.csv             --out-json build/robust/aggregate_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-robust-effects-v0-3
          path: build/robust/
          retention-days: 30

  model:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trait-memory-robust-effects-v0-3
          path: build/robust
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
            any::metafor
            any::Matrix
            any::MASS
      - name: Fit measurement-aware crossed model
        run: |
          mkdir -p build/model
          Rscript scripts/analysis/fit_trait_memory_measurement_aware_v0_3.R             --effects build/robust/effects_with_se_log.csv             --aggregate-json build/robust/aggregate_result.json             --out build/model/measurement_aware_result.json             --bootstrap-table build/model/measurement_aware_cluster_bootstrap.csv
      - name: Test BLUP portability sensitivity
        run: |
          Rscript scripts/analysis/test_trait_memory_portability_blup_v0_3.R             --effects build/robust/effects_with_se_log.csv             --aggregate-json build/robust/aggregate_result.json             --out build/model/blup_portability_result.json             --predictions build/model/blup_portability_predictions.csv
      - name: Test correlated-trait zero-family null
        run: |
          Rscript scripts/analysis/test_trait_memory_correlated_trait_null_v0_3.R             --effects build/robust/effects_with_se_log.csv             --aggregate-json build/robust/aggregate_result.json             --out build/model/correlated_trait_null_result.json             --null-table build/model/correlated_trait_null.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-robustness-v0-3
          path: |
            build/robust/
            build/model/
          retention-days: 30
