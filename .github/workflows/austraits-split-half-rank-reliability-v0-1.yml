name: AusTraits split-half rank reliability v0.1

on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-split-half-rank-reliability-v0-1.yml'
      - 'data/austraits_rank_split_half_reliability_v0_1.json'
      - 'scripts/analysis/run_austraits_split_half_batch_v0_1.py'
      - 'scripts/analysis/run_austraits_split_half_system_v0_1.R'
      - 'scripts/analysis/summarize_austraits_split_half_reliability_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyyaml
      - name: Download frozen final core, effects and trait config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/final build/effects build/source
          gh run download 37561341286 -R "$GITHUB_REPOSITORY" -n austraits-exact-final-core-v0-6-5 -D build/final
          gh run download 37561484157 -R "$GITHUB_REPOSITORY" -n austraits-real-effects-v0-1 -D build/effects
          curl -L --fail -o build/source/traits.yml \
            https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - id: matrix
        name: Freeze high-support matched-log subset and build batches
        run: |
          python - <<'PY'
          import base64,csv,json,os,pandas as pd,yaml
          e=pd.read_csv('build/effects/effects.csv')
          c=pd.read_csv('build/final/core/core_systems.csv')
          x=e[(e.log_domain_pass==True)&(e.n_species_prune>=40)].merge(
              c[['family','trait_name','n_input_species','n_prune','n_bind','config_type']],
              on=['family','trait_name'],how='inner',validate='one_to_one')
          assert len(x)==158,(len(x),x.family.nunique(),x.trait_name.nunique())
          assert x.family.nunique()==30 and x.trait_name.nunique()==13
          cfg=yaml.safe_load(open('build/source/traits.yml'))['traits']['elements']
          systems=[]
          for r in x.sort_values(['family','trait_name']).itertuples(index=False):
              u=cfg[r.trait_name].get('units')
              systems.append({
                'system_id':r.system_id,'family':r.family,'trait_name':r.trait_name,
                'expected_unit':'' if u is None else str(u).strip(),
                'n_input_species':int(r.n_input_species),'n_prune':int(r.n_prune),'n_bind':int(r.n_bind),
                'S3_log_rho':float(r.S3_log_rho),'prune_log_rho':float(r.prune_log_rho),
                '_weight':int(r.n_input_species)**2+int(r.n_prune)**2
              })
          nb=12
          bins=[{'weight':0,'systems':[]} for _ in range(nb)]
          for s in sorted(systems,key=lambda z:(-z['_weight'],z['family'],z['trait_name'])):
              k=min(range(nb),key=lambda i:(bins[i]['weight'],i))
              bins[k]['systems'].append({q:s[q] for q in ['system_id','family','trait_name','expected_unit','n_input_species','n_prune','n_bind','S3_log_rho','prune_log_rho']})
              bins[k]['weight']+=s['_weight']
          inc=[]
          for i,b in enumerate(bins,1):
              raw=json.dumps(b['systems'],separators=(',',':')).encode()
              inc.append({'batch_id':f'S{i:02d}','systems_b64':base64.b64encode(raw).decode(),'n_systems':len(b['systems'])})
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          json.dump({'n_systems':len(x),'n_families':x.family.nunique(),'n_traits':x.trait_name.nunique(),
                     'support_rule':'n_species_prune>=40 and log_domain_pass'},open('build/subset.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-split-half-subset-v0-1
          path: build/subset.json

  split:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install duckdb
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ape
      - name: Pin V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Download pinned source
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 -o build/source/austraits.parquet \
            https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
      - name: Compute split-half rhos
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/states build/result
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
          python scripts/analysis/run_austraits_split_half_batch_v0_1.py \
            --batch-json build/batch/systems.json \
            --parquet build/source/austraits.parquet \
            --out-dir build/result \
            --state-dir build/states \
            --r-script scripts/analysis/run_austraits_split_half_system_v0_1.R
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-split-half-${{ matrix.batch_id }}
          path: build/result/*.json
          retention-days: 30

  summarize:
    needs: split
    if: needs.split.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: austraits-split-half-S*
          path: build/all
          merge-multiple: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy
      - name: Summarize system and rank reliability
        run: |
          mkdir -p build/result
          python scripts/analysis/summarize_austraits_split_half_reliability_v0_1.py \
            --input-dir build/all \
            --out build/result/result.json \
            --table-out build/result/split_rhos.csv
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-split-half-rank-reliability-v0-1
          path: build/result/
          retention-days: 30
