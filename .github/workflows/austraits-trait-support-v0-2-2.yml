name: AusTraits v7 corrected trait support v0.2.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install duckdb
      - name: Validate technical identity correction
        run: |
          python - <<'PY'
          import json
          f=json.load(open('data/austraits_record_key_fix_v0_2_2.json'))
          d=json.load(open('data/austraits_trait_support_design_v0_2.json'))
          a=json.load(open('results/austraits_observation_id_v0_2_1/result.json'))
          assert a['status']=='HOLD_AUSTRAITS_OBSERVATION_ID_NOT_GLOBAL'
          assert a['cross_dataset_colliding_ids']==39207
          assert f['status']=='AUSTRAITS_COMPOSITE_RECORD_KEY_FIXED_POST_SUPPORT_PRE_OUTCOME'
          assert f['thresholds_changed'] is False
          assert f['source_changed'] is False
          assert f['trait_selection_changed'] is False
          assert f['third_source_allowed'] is False
          assert d['matched_to_bien']['thresholds_identical'] is True
          PY
      - name: Download exact pinned parquet
        run: |
          mkdir -p build/austraits_trait_support_v0_2_2
          curl -L --fail --retry 4 --retry-delay 10 -o build/austraits_trait_support_v0_2_2/austraits.parquet             https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/austraits_trait_support_v0_2_2/austraits.parquet" | sha256sum -c -
      - name: Run corrected aggregate-only support audit
        run: |
          python scripts/source/audit_austraits_trait_support_v0_2_2.py             --parquet build/austraits_trait_support_v0_2_2/austraits.parquet             --out build/austraits_trait_support_v0_2_2/result.json             --table-out build/austraits_trait_support_v0_2_2/family_trait_support.csv
      - name: Enforce output firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/austraits_trait_support_v0_2_2/result.json'))
          assert x['version']=='v0.2.2'
          assert x['outcome_blind'] is True
          assert x['raw_trait_values_opened'] is False
          assert x['biological_turnover_outcomes_opened'] is False
          assert x['trait_value_returned'] is False
          assert x['row_level_species_returned'] is False
          assert x['row_level_coordinates_returned'] is False
          assert x['status'] in {'AUSTRAITS_TRAIT_SUPPORT_PASS','HOLD_AUSTRAITS_TRAIT_SUPPORT'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-trait-support-v0-2-2
          path: |
            build/austraits_trait_support_v0_2_2/result.json
            build/austraits_trait_support_v0_2_2/family_trait_support.csv
