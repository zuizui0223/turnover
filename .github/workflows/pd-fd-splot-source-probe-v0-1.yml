name: sPlotOpen pinned public archive schema probe v0.1
on:
  push:
    branches: [analysis/pd-fd-biomass-source-gate-20261114]
    paths:
      - scripts/analysis/probe_splotopen_source_v0_1.py
      - scripts/analysis/audit_splotopen_gift_coverage_v0_1.py
      - .github/workflows/pd-fd-splot-source-probe-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/probe_splotopen_source_v0_1.py
      - scripts/analysis/audit_splotopen_gift_coverage_v0_1.py
      - .github/workflows/pd-fd-splot-source-probe-v0-1.yml
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive probe on synthetic zip (no biological results)
        run: |
          python3 -m py_compile scripts/analysis/probe_splotopen_source_v0_1.py
          python3 scripts/analysis/probe_splotopen_source_v0_1.py --self-test
      - name: Checkout public source mirror at fixed archival commit (no LFS bulk pull)
        uses: actions/checkout@v4
        with:
          repository: ezequielscott/sPlotOpen
          ref: 1bfcad669ae1a7e6f0a419159dd3051e83bdd26b
          path: public-splot-mirror
          lfs: false
          persist-credentials: false
      - name: Fetch only composition, header and derived-CWM LFS objects
        run: |
          cd public-splot-mirror
          git lfs version
          git lfs pull --include='3474_76_Dataset/sPlotOpen_DT(2).txt,3474_76_Dataset/sPlotOpen_header(3).txt,3474_76_Dataset/sPlotOpen_CWM_CWV(2).txt'
      - name: Construct throwaway source ZIP with exact public mirror bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('public-splot-mirror/3474_76_Dataset')
          names = ['sPlotOpen_DT(2).txt','sPlotOpen_header(3).txt','sPlotOpen_CWM_CWV(2).txt']
          for name in names:
              p = root / name
              if not p.exists() or p.stat().st_size < 100000:
                  raise SystemExit(f'Not a resolved LFS data object: {p}')
          with zipfile.ZipFile('/tmp/splotopen_public_mirror_5806.zip','w',compression=zipfile.ZIP_STORED) as z:
              for name in names:
                  z.write(root / name, arcname=name)
          PY
      - name: Verify genuine data schemas and plot IDs (no effects)
        run: |
          python3 scripts/analysis/probe_splotopen_source_v0_1.py \
            --archive /tmp/splotopen_public_mirror_5806.zip --out source_probe_summary.json
      - name: Verify exact-name and public-trait coverage in GIFT 3.1 (source-only)
        run: |
          python3 -m py_compile scripts/analysis/audit_splotopen_gift_coverage_v0_1.py
          python3 scripts/analysis/audit_splotopen_gift_coverage_v0_1.py \
            --archive /tmp/splotopen_public_mirror_5806.zip --out source_gift_coverage_summary.json
      - name: Preserve only nonraw source gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-fd-splotopen-source-probe-v0-1
          path: |
            source_probe_summary.json
            source_gift_coverage_summary.json
          if-no-files-found: ignore
          retention-days: 14
