name: Lineage memory real effects v0.2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen core and model-informativeness result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core build/model-info
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          gh run download 37104973075 -R "$GITHUB_REPOSITORY" -n lineage-memory-model-informativeness-v0-1 -D build/model-info
          test -f build/core/trait_memory_crossed_core_v0_6/core_systems.csv
          test -f build/model-info/result.json
          python - <<'PY'
          import json
          x=json.load(open('build/model-info/result.json'))
          assert x['status']=='LINEAGE_MEMORY_MODEL_INFORMATIVENESS_PASS'
          assert x['gate_pass'] is True
          d=json.load(open('data/lineage_memory_repeatability_design_v0_1.json'))
          assert d['real_memory_effects_opened'] is False
          PY
          mkdir -p results/trait_memory_crossed_core_v0_6
          cp build/core/trait_memory_crossed_core_v0_6/core_systems.csv results/trait_memory_crossed_core_v0_6/core_systems.csv
      - id: matrix
        run: |
          python - <<'PY'
          import base64,csv,json,os
          rows=list(csv.DictReader(open('results/trait_memory_crossed_core_v0_6/core_systems.csv',newline='')))
          assert len(rows)==201
          systems=[]
          for i,r in enumerate(sorted(rows,key=lambda x:(x['family'],x['trait_name'])),1):
              systems.append({
                'id':f'L{i:04d}','family':r['family'],'trait_name':r['trait_name'],
                'semantic_class':r['semantic_class'],
                '_weight':int(r['n_input_species'])**2+int(r['n_prune'])**2
              })
          nb=24
          bins=[{'weight':0,'systems':[]} for _ in range(nb)]
          for r in sorted(systems,key=lambda x:(-x['_weight'],x['family'],x['trait_name'])):
              k=min(range(nb),key=lambda i:(bins[i]['weight'],i))
              x={q:r[q] for q in ['id','family','trait_name','semantic_class']}
              bins[k]['systems'].append(x); bins[k]['weight']+=r['_weight']
          include=[]
          for i,b in enumerate(bins,1):
              raw=json.dumps(b['systems'],separators=(',',':')).encode()
              include.append({'batch_id':f'B{i:03d}','systems_b64':base64.b64encode(raw).decode(),'n_systems':len(b['systems']),'weight':b['weight']})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          PY

  effect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Download frozen final core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          mkdir -p results/trait_memory_crossed_core_v0_6
          cp build/core/trait_memory_crossed_core_v0_6/core_systems.csv results/trait_memory_crossed_core_v0_6/core_systems.csv
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Decode batch
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/effects
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
      - name: Open frozen real memory effects
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          python scripts/analysis/run_lineage_memory_real_effect_batch_v0_2.py \
            --batch-json build/batch/systems.json \
            --out-dir build/effects \
            --r-script scripts/analysis/run_trait_memory_real_effect_v0_7.R
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-memory-real-${{ matrix.batch_id }}
          path: build/effects/*.json
          retention-days: 30

  aggregate:
    needs: effect
    if: always() && needs.effect.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lineage-memory-real-B*
          path: build/all-effects
          merge-multiple: true
      - name: Download frozen final core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
      - name: Aggregate all 201 real effects
        run: |
          mkdir -p build/real
          python scripts/analysis/aggregate_trait_memory_real_effects_v0_7.py \
            --input-dir build/all-effects \
            --core-table build/core/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/real/effects.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-memory-real-effects-v0-2
          path: build/real/effects.csv

  model:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lineage-memory-real-effects-v0-2
          path: build/real
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
      - name: Fit conditional family repeatability
        run: |
          mkdir -p build/model
          Rscript scripts/analysis/fit_lineage_memory_repeatability_v0_2.R \
            --effects build/real/effects.csv \
            --out build/model/result.json \
            --bootstrap-table build/model/bootstrap.csv \
            --loo-table build/model/leave_one_out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-memory-repeatability-v0-2
          path: build/model/
