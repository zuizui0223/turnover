name: Phylogenetic memory balance-normalized v0.5

on:
  push:
    branches:
      - methods/phylo-memory-measurability-v0-1
    paths:
      - '.triggers/phylo-memory-balance-normalized-v0-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen mechanism design
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/phylo_memory_balance_normalized_design_v0_5.json'))
          e=json.load(open('data/phylo_memory_balance_normalized_execution_v0_5_1.json'))
          assert d['status']=='FROZEN_BEFORE_BALANCE_NORMALIZED_RANK_SEPARATION_RESULT_OPENING'
          assert e['status']=='FROZEN_BEFORE_BALANCE_NORMALIZED_RETRY'
          assert e['outcome_based_exclusion'] is False
          assert d['factorization']['target']==0.30
          assert d['factorization']['tolerance']==0.02
          assert d['generator_held_fixed']['parameter_grid']==[0.01,0.03162277660168379,0.1,0.31622776601683794,1,3.1622776601683795,10,31.622776601683793,100]
          assert d['no_posthoc_grid_expansion'] is True
          assert d['real_trait_values_used'] is False and d['real_memory_effects_used'] is False
          PY
      - name: Download artifact-backed Mk2 systems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/source
          gh run download 37199814112 -R "$GITHUB_REPOSITORY" -n phylo-memory-mk2-generator-v0-4-1 -D build/source
          test -f build/source/systems.csv
      - id: matrix
        name: Freeze exact execution batches
        run: |
          python - <<'PY'
          import base64,csv,json,os
          rows=[]
          for x in csv.DictReader(open('build/source/systems.csv',newline='')):
              rows.append({'id':x['system_id'],'family':x['family'],'trait_name':x['trait_name']})
          rows.sort(key=lambda r:(r['family'],r['trait_name'],r['id']))
          assert len(rows)==276
          bins=[[] for _ in range(32)]
          for i,r in enumerate(rows): bins[i%32].append(r)
          include=[]
          for i,b in enumerate(bins,1):
              raw=json.dumps(b,separators=(',',':')).encode()
              include.append({'batch_id':f'B{i:03d}','systems_b64':base64.b64encode(raw).decode(),'n_systems':len(b)})
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-balance-normalized-input-v0-5
          path: build/source/systems.csv

  analyze:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phylo-memory-balance-normalized-input-v0-5
          path: build/input
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Download frozen crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/crosswalk
          gh run download 37086169965 -R "$GITHUB_REPOSITORY" -n trait-memory-crosswalk-v0-4 -D build/crosswalk
          test -f build/crosswalk/crosswalk.csv
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Decode batch
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/results
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
      - name: Run balance-normalized mechanism test
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          python scripts/analysis/run_phylo_memory_binary_ceiling_batch_v0_3_1.py \
            --batch-json build/batch/systems.json \
            --crosswalk build/crosswalk/crosswalk.csv \
            --systems-table build/input/systems.csv \
            --out-dir build/results \
            --r-script scripts/analysis/analyze_phylo_memory_balance_normalized_system_v0_5.R
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-balance-normalized-${{ matrix.batch_id }}-v0-5
          path: build/results/*.json

  aggregate:
    needs: analyze
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phylo-memory-balance-normalized-B*-v0-5
          path: build/results
          merge-multiple: true
      - run: pip install numpy pandas
      - name: Aggregate paired state-balance test
        run: |
          mkdir -p build/aggregate
          python scripts/analysis/aggregate_phylo_memory_balance_normalized_v0_5.py \
            --input-dir build/results \
            --out build/aggregate/result.json \
            --table-out build/aggregate/systems.csv \
            --trait-out build/aggregate/traits.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-balance-normalized-v0-5
          path: build/aggregate/
