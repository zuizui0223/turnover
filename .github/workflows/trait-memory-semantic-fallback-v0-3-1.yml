name: Trait memory semantic fallback v0.3.1

on:
  pull_request:
    paths:
      - '.triggers/trait-memory-semantic-fallback-v0-3-1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen temporal support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/support
          gh run download 37085340395 -R "$GITHUB_REPOSITORY" -n trait-memory-temporal-support-v0-2-1 -D build/support
          test -f build/support/family_trait_support.csv
      - id: matrix
        name: Build structurally supported trait matrix
        run: |
          python - <<'PY'
          import csv,json,os
          sem=json.load(open('data/bien_trait_semantic_contract_v0_3.json'))
          cmap={t:'continuous_scalar' for t in sem['representation_rules']['continuous_scalar']['traits']}
          cmap.update({t:'nominal_categorical' for t in sem['representation_rules']['nominal_categorical']['traits']})
          traits=set()
          with open('build/support/family_trait_support.csv',newline='') as fh:
              for r in csv.DictReader(fh):
                  if str(r['structural_pass']).strip().lower() in {'true','t','1'}:
                      traits.add(r['trait_name'])
          rows=[{'id':f'T{i+1:03d}','trait_name':t,'semantic_class':cmap[t]} for i,t in enumerate(sorted(traits))]
          assert len(rows)==49, len(rows)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY

  semantic:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
      - name: Download frozen temporal support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/support
          gh run download 37085340395 -R "$GITHUB_REPOSITORY" -n trait-memory-temporal-support-v0-2-1 -D build/support
      - name: Pin RBIEN
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
      - name: Validate fallback contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/trait_memory_semantic_queryplan_fallback_v0_3_1.json'))
          assert x['status']=='TRAIT_MEMORY_SEMANTIC_QUERYPLAN_FALLBACK_FROZEN_PRE_RESULT'
          assert x['chronology']['semantic_result_seen_before_freeze'] is False
          assert x['thresholds_changed'] is False
          assert x['semantic_rules_changed'] is False
          assert x['can_rescue_failure'] is False
          PY
      - name: Run one trait partition
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
          TRAIT_NAME: ${{ matrix.trait_name }}
          SEMANTIC_CLASS: ${{ matrix.semantic_class }}
          TRAIT_ID: ${{ matrix.id }}
        run: |
          mkdir -p build/semantic-part
          Rscript scripts/source/audit_trait_memory_semantic_partition_v0_3_1.R \
            --trait "$TRAIT_NAME" --class "$SEMANTIC_CLASS" \
            --support-table build/support/family_trait_support.csv \
            --out "build/semantic-part/$TRAIT_ID.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-semantic-${{ matrix.id }}
          path: build/semantic-part/${{ matrix.id }}.csv
          retention-days: 30

  aggregate:
    needs: semantic
    if: always() && needs.semantic.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trait-memory-semantic-T*
          path: build/all-semantic
          merge-multiple: true
      - name: Aggregate exact partitions
        run: |
          mkdir -p build/trait_memory_semantic_v0_3
          python scripts/source/aggregate_trait_memory_semantic_v0_3_1.py \
            --input-dir build/all-semantic \
            --out build/trait_memory_semantic_v0_3/result.json \
            --table-out build/trait_memory_semantic_v0_3/semantic.csv
      - name: Enforce outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/trait_memory_semantic_v0_3/result.json'))
          assert x['outcome_blind'] is True
          assert x['real_trait_values_opened'] is False
          assert x['real_memory_effects_opened'] is False
          assert x['n_structural_candidates']==1455
          assert x['status'] in {'TRAIT_MEMORY_SEMANTIC_PASS','HOLD_TRAIT_MEMORY_SEMANTIC'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-semantic-v0-3-1
          path: build/trait_memory_semantic_v0_3/
