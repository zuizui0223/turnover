name: Jena TBE matched training purge reference
on:
  push:
    branches: [analysis/jena-tbe-pool-fox-transfer-20261127]
    paths:
      - scripts/analysis/jena_tbe2012_matched_purge_reference.py
      - .github/workflows/jena-tbe-matched-purge-reference.yml
  workflow_dispatch:
jobs:
  matched-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/analysis/jena_tbe2012_matched_purge_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jena-tbe-matched-purge-reference-nonraw
          path: results/jena_tbe2012_matched_purge_reference_20261127_v0_1.json
          if-no-files-found: warn
