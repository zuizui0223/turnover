name: GloBI joint support transport v0.5 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Record supersession
        run: |
          echo "v0.5 is retained only as an audit record."
          echo "It was superseded before any scientific support result because custom_user_agent was set after DuckDB startup and the fallback request returned HTTP 406."
          echo "Use v0.6; no source, file, checksum, system definition, or scientific threshold changed."
