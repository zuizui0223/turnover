name: BIODEPTH 2005 original matched grass legume forb eight-site replay
on:
  push:
    branches: [analysis/biodepth-8site-source-first-20261115]
    paths:
      - scripts/analysis/replay_biodepth_two_guild_matched_v0_1.py
      - .github/workflows/biodepth-matched-two-guild-replay-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/replay_biodepth_two_guild_matched_v0_1.py
      - .github/workflows/biodepth-matched-two-guild-replay-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-match:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic source-independent numerical dependency
        run: python -m pip install -q numpy==2.3.4
      - name: Run source-scope fixture before original effects
        run: |
          python -m py_compile scripts/analysis/replay_biodepth_two_guild_matched_v0_1.py
          python scripts/analysis/replay_biodepth_two_guild_matched_v0_1.py --self-test
      - name: Rebuild exact original 110-plot source-matched comparison, independently from original Figshare
        run: |
          python scripts/analysis/replay_biodepth_two_guild_matched_v0_1.py \
            --out results/biodepth_8site_source_v0_1/legume_forb_matched_replay_ci_v0_1.json
      - name: Upload only nonraw matched-stratum source QA and eight site effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biodepth-original-110plot-matched-legume-forb-replay-v0-1
          path: results/biodepth_8site_source_v0_1/legume_forb_matched_replay_ci_v0_1.json
          if-no-files-found: ignore
          retention-days: 30
