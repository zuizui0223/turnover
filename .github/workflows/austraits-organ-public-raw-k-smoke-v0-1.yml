name: AusTraits original v7 raw-to-matched K technical reproduction v0.1
on:
  push:
    branches: [paper/austraits-organ-ecology-v0-2]
    paths:
      - .github/workflows/austraits-organ-public-raw-k-smoke-v0-1.yml
      - scripts/qa/audit_austraits_organ_raw_k_smoke_v0_1.py
      - results/austraits_organ_paper_frozen_rebuild_inputs_v0_1/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-public-source-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse two fixed original source-only cross-organ pairs, no K-selected cohort
        run: |
          python scripts/qa/audit_austraits_organ_raw_k_smoke_v0_1.py \
            --mode prepare --batch build/rawK/fixed_pairs.json
      - name: Install original source-native numeric dependencies
        run: pip install pandas duckdb pyyaml numpy
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::Rcpp
            any::jsonlite
            any::phytools
      - name: Pin original tree builder and validate original R code
        run: |
          Rscript -e "parse(file='scripts/analysis/fit_austraits_k_shared_taxon_pairs_v0_1.R')"
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Recover public original AusTraits v7 source and pinned trait units
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 \
            -o build/source/austraits.parquet \
            https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail --retry 3 -o build/source/traits.yml \
            https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Actually recompute source-native species states and matched-tip K on S3/prune
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/analysis/run_austraits_k_shared_taxon_pairs_batch_v0_1.py \
            --batch-json build/rawK/fixed_pairs.json \
            --support results/austraits_organ_paper_frozen_rebuild_inputs_v0_1/shared_taxon_pair_support.json \
            --parquet build/source/austraits.parquet \
            --traits-yml build/source/traits.yml \
            --observed-K results/austraits_organ_paper_frozen_rebuild_inputs_v0_1/original_K_effects.csv \
            --design data/austraits_k_shared_taxa_cross_trait_design_v0_1.json \
            --r-script scripts/analysis/fit_austraits_k_shared_taxon_pairs_v0_1.R \
            --out build/rawK/reestimated_K.json
      - name: Verify exact source byte, species support and real-tree K algebra
        run: |
          python scripts/qa/audit_austraits_organ_raw_k_smoke_v0_1.py \
            --mode finish \
            --batch build/rawK/fixed_pairs.json \
            --parquet build/source/austraits.parquet \
            --raw-result build/rawK/reestimated_K.json \
            --report build/rawK/raw_to_K_reproduction_verdict.json
          grep -q PASS_PUBLIC_AUSTRAITS_V7_RAW_TO_K_TECHNICAL_SMOKE \
            build/rawK/raw_to_K_reproduction_verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-original-public-v7-raw-to-K-two-pair-smoke-v0-1
          path: |
            build/rawK/reestimated_K.json
            build/rawK/raw_to_K_reproduction_verdict.json
          retention-days: 90
          if-no-files-found: error
