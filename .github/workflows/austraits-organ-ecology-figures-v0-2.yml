name: AusTraits organ ecology source-linked paper figures v0.2

on:
  push:
    branches:
      - paper/austraits-organ-ecology-v0-2
    paths:
      - scripts/analysis/render_austraits_organ_k_paper_figures_v0_2.py
      - .github/workflows/austraits-organ-ecology-figures-v0-2.yml
      - docs/AUSTRAITS_K_ORGAN_ECOLOGY_MANUSCRIPT_V0_2.md
      - data/austraits_organ_paper_claim_registry_v0_2.json
      - scripts/publication/freeze_austraits_organ_aggregate_archives_v0_1.py
      - results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paper_figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting requirements (never refit any model)
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Verify and use original SHA256-pinned aggregate-only inputs committed to the paper branch
        shell: bash
        run: |
          mkdir -p build/module build/transition build/joint build/figures
          python scripts/publication/freeze_austraits_organ_aggregate_archives_v0_1.py \
            --inputs results/austraits_organ_paper_frozen_aggregate_inputs_v0_1
          cp results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/reproductive_vegetative_lofo.json build/module/
          cp results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/nonflora_283_to_142_source_support_transition.json build/transition/
          cp results/austraits_organ_paper_frozen_aggregate_inputs_v0_1/joint_nonflora_shared_source_K.json build/joint/
      - name: Render 3 source-linked main figures and verify claim provenance
        run: |
          python -m py_compile scripts/analysis/render_austraits_organ_k_paper_figures_v0_2.py
          python scripts/analysis/render_austraits_organ_k_paper_figures_v0_2.py \
            --module build/module/reproductive_vegetative_lofo.json \
            --transition build/transition/nonflora_283_to_142_source_support_transition.json \
            --joint build/joint/joint_nonflora_shared_source_K.json \
            --claims data/austraits_organ_paper_claim_registry_v0_2.json \
            --out-dir build/figures
          test "$(find build/figures -type f -name 'figure[123]*' | wc -l)" -eq 6
          test -s build/figures/figure_manifest.json
      - name: Upload figure bundle with exact archive SHA256 provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: austraits-organ-ecology-paper-figures-v0-2
          path: build/figures/
          retention-days: 90
          if-no-files-found: error
