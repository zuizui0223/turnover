name: Phylogenetic memory binary ceiling v0.3.1

on:
  workflow_dispatch:
  push:
    branches:
      - methods/phylo-memory-measurability-v0-1
    paths:
      - '.triggers/phylo-memory-binary-ceiling-v0-3-1'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate pre-outcome revised design
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/phylo_memory_binary_ceiling_design_v0_3_1.json'))
          assert d['status']=='FROZEN_BEFORE_EDGE_SPLIT_CEILING_ANALYSIS'
          assert d['supersedes_without_execution']=='data/phylo_memory_binary_ceiling_design_v0_3.json'
          assert d['benchmark']==0.15
          assert d['real_trait_outcomes_used'] is False
          PY
      - name: Download exact frozen v0.2 mechanism table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/source
          gh run download 37191027580 -R "$GITHUB_REPOSITORY" -n phylo-memory-calibration-ceiling-v0-2 -D build/source
          test -f build/source/systems.csv
      - id: matrix
        name: Freeze exact categorical execution batches
        run: |
          python - <<'PY'
          import base64,csv,json,os
          rows=[]
          with open('build/source/systems.csv',newline='') as f:
              for x in csv.DictReader(f):
                  if x['semantic_class']=='nominal_categorical':
                      rows.append({'id':x['system_id'],'family':x['family'],'trait_name':x['trait_name']})
          rows.sort(key=lambda r:(r['family'],r['trait_name'],r['id']))
          assert len(rows)==265, len(rows)
          nb=32
          bins=[[] for _ in range(nb)]
          for i,r in enumerate(rows):
              bins[i%nb].append(r)
          include=[]
          for i,b in enumerate(bins,1):
              if not b: continue
              raw=json.dumps(b,separators=(',',':')).encode()
              include.append({'batch_id':f'B{i:03d}','systems_b64':base64.b64encode(raw).decode(),'n_systems':len(b)})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          json.dump({'n_categorical':len(rows),'n_batches':len(include)},open('build/source/prepare.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-binary-ceiling-input-v0-3-1
          path: |
            build/source/systems.csv
            build/source/prepare.json

  audit:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phylo-memory-binary-ceiling-input-v0-3-1
          path: build/input
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Download frozen crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/crosswalk
          gh run download 37086169965 -R "$GITHUB_REPOSITORY" -n trait-memory-crosswalk-v0-4 -D build/crosswalk
          test -f build/crosswalk/crosswalk.csv
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Decode batch
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/results
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
      - name: Compute realizable edge-split ceilings
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          python scripts/analysis/run_phylo_memory_binary_ceiling_batch_v0_3_1.py             --batch-json build/batch/systems.json             --crosswalk build/crosswalk/crosswalk.csv             --systems-table build/input/systems.csv             --out-dir build/results             --r-script scripts/analysis/analyze_phylo_memory_binary_ceiling_system_v0_3_1.R
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-binary-ceiling-${{ matrix.batch_id }}-v0-3-1
          path: build/results/*.json

  aggregate:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phylo-memory-binary-ceiling-B*-v0-3-1
          path: build/results
          merge-multiple: true
      - name: Aggregate mechanism decomposition
        run: |
          pip install numpy pandas
          mkdir -p build/aggregate
          python scripts/analysis/aggregate_phylo_memory_binary_ceiling_v0_3_1.py             --input-dir build/results             --out build/aggregate/result.json             --table-out build/aggregate/systems.csv             --trait-out build/aggregate/traits.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phylo-memory-binary-ceiling-v0-3-1
          path: build/aggregate/
