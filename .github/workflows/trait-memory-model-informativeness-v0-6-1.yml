name: Trait memory crossed-model informativeness v0.6.1

on:
  pull_request:
    paths:
      - '.triggers/trait-memory-model-informativeness-v0-6-1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  model-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
      - name: Download frozen final crossed core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/final-core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/final-core
          test -f build/final-core/trait_memory_crossed_core_v0_6/result.json
          test -f build/final-core/trait_memory_crossed_core_v0_6/core_systems.csv
          mkdir -p results/trait_memory_crossed_core_v0_6
          cp build/final-core/trait_memory_crossed_core_v0_6/result.json results/trait_memory_crossed_core_v0_6/result.json
          cp build/final-core/trait_memory_crossed_core_v0_6/core_systems.csv results/trait_memory_crossed_core_v0_6/core_systems.csv
      - name: Validate pre-outcome model informativeness contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_model_informativeness_v0_6_1.json'))
          c=json.load(open('results/trait_memory_crossed_core_v0_6/result.json'))
          assert d['status']=='FROZEN_BEFORE_TEMPORAL_MEMORY_EFFECT_OPENING'
          assert d['benchmarks']['trait_dominant']['target_log_variance_ratio']==0.6931471805599453
          assert d['benchmarks']['lineage_dominant']['target_log_variance_ratio']==-0.6931471805599453
          assert d['replicates_per_benchmark']==1000
          assert d['admission']['valid_nonsingular_refit_fraction_min']==0.90
          assert d['admission']['directional_recovery_min']==0.80
          assert d['admission']['median_absolute_log_ratio_error_max']==0.35
          assert d['real_memory_effects_opened'] is False
          assert c['status']=='TRAIT_MEMORY_CROSSED_CORE_PASS'
          assert c['gate_pass'] is True
          PY
      - name: Run crossed-graph known-truth simulations
        run: |
          mkdir -p build/model-info
          Rscript scripts/analysis/run_trait_memory_model_informativeness_v0_6_1.R \
            --core-table results/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/model-info/result.json \
            --table-out build/model-info/simulations.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-model-informativeness-v0-6-1
          path: build/model-info/
