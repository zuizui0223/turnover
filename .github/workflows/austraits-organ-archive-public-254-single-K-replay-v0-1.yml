name: Archive completed full original 254 single phytools K clean-source replay v0.1
on:
  push:
    branches: [paper/austraits-organ-ecology-v0-2]
    paths:
      - data/austraits_254_original_single_K_replay_completed_trigger_v0_1.json
      - scripts/publication/archive_austraits_254_fresh_single_K_v0_1.py
      - .github/workflows/austraits-organ-archive-public-254-single-K-replay-v0-1.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve-original-254-single-phytools-K:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch all original R K outputs for the complete verified public-source job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/fresh_K build/plan build/verdict build/qa_recheck build/rechecked
          gh run download 40541276639 -R "$GITHUB_REPOSITORY" \
            -n austraits-original-public-v7-full-254-single-phytools-K-final-replay-v0-1 \
            -D build/verdict
          gh run download 40541276639 -R "$GITHUB_REPOSITORY" \
            -n austraits-original-254-K-source-blind-workload-plan-v0-1 \
            -D build/plan
          for i in $(seq -w 1 16); do
            gh run download 40541276639 -R "$GITHUB_REPOSITORY" \
              -n "austraits-public-v7-original-254-phytools-K-K$i-v0-1" \
              -D build/fresh_K
          done
          test "$(find build/fresh_K -maxdepth 1 -name 'A????.json' | wc -l)" -eq 254
          test "$(find build/fresh_K -maxdepth 1 -name 'K??_audit.json' | wc -l)" -eq 16
          test -s build/verdict/all_254_original_single_trait_K_verdict.json
      - name: Independently rerun all original 254 numeric K and native tip comparisons
        run: |
          cp build/fresh_K/K??_audit.json build/qa_recheck/
          python scripts/qa/rebuild_austraits_original_254_single_K_v0_1.py \
            --mode summarize --plan-dir build/plan \
            --fresh-dir build/fresh_K --audit-dir build/qa_recheck \
            --output build/rechecked/all_254_original_single_trait_K_verdict.json
          cmp -s build/rechecked/all_254_original_single_trait_K_verdict.json \
            build/verdict/all_254_original_single_trait_K_verdict.json
          grep -q PASS_PUBLIC_V7_ALL_254_ORIGINAL_PHYTOOLS_SINGLE_K_REBUILT \
            build/rechecked/all_254_original_single_trait_K_verdict.json
      - name: Pin SHA256 for 254 fresh K, 16 batch audits and independent final aggregate
        run: |
          python scripts/publication/archive_austraits_254_fresh_single_K_v0_1.py \
            --source build/fresh_K \
            --verdict build/verdict/all_254_original_single_trait_K_verdict.json \
            --plan-dir build/plan \
            --out-dir results/austraits_organ_paper_public_v7_254_single_K_replay_v0_1 \
            --run-id 40541276639
          test "$(find results/austraits_organ_paper_public_v7_254_single_K_replay_v0_1 -maxdepth 1 -type f | wc -l)" -eq 272
      - name: Commit original 254 single K numerical replay without raw original species data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/austraits_organ_paper_public_v7_254_single_K_replay_v0_1/
          if git diff --cached --quiet; then
            echo SINGLE_K_FULL_REPLAY_ALREADY_EXACT
          else
            git commit -m "Preserve verified full 254 native single-trait K public-source replay"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-254-original-K-longterm-SHA256-provenance-v0-1
          path: results/austraits_organ_paper_public_v7_254_single_K_replay_v0_1/all_254_single_K_replay_archive_manifest.json
          retention-days: 90
          if-no-files-found: error
