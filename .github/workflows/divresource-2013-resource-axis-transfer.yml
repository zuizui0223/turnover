name: DivResource balanced trait axis resource transfer
on:
  push:
    branches: [analysis/divresource-pool-transfer-20261126]
    paths:
      - scripts/analysis/divresource_2013_resource_axis_contrast_transfer.py
      - .github/workflows/divresource-2013-resource-axis-transfer.yml
  workflow_dispatch:
jobs:
  resource-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/analysis/divresource_2013_resource_axis_contrast_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: divresource-fixed-resource-axis-contrasts-nonraw
          path: results/divresource_2013_resource_axis_contrast_transfer_20261127_v0_1.json
          if-no-files-found: warn
