name: Jena TBE 2012 fixed whole pool Fox component transfer
on:
  push:
    branches: [analysis/jena-tbe-pool-fox-transfer-20261127]
    paths:
      - scripts/analysis/jena_tbe2012_pool_fox_transfer_20261127.py
      - .github/workflows/jena-tbe-pool-fox-transfer-20261127.yml
  workflow_dispatch:
jobs:
  fixed-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/analysis/jena_tbe2012_pool_fox_transfer_20261127.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jena-2012-fixed-pool-fox-transfer-aggregate
          path: results/jena_tbe2012_84plot_pool_fox_transfer_20261127_v0_1.json
          if-no-files-found: warn
