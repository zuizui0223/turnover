name: AusTraits provenance retry v0.6.5.5

on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-provenance-retry-v0-6-5-5.yml'
      - 'data/austraits_provenance_retry_v0_6_5_5.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate technical-only retry
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/austraits_provenance_retry_v0_6_5_5.json'))
          assert d['status']=='TECHNICAL_PROVENANCE_RETRY_PRE_EFFECT'
          assert d['scientific_change'] is False
          assert d['selection_changed'] is False
          assert d['memory_effects_opened'] is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: austraits-final-core-v0-6-5-4
          path: build/final
          repository: zuizui0223/turnover
          run-id: 37560915567
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --index-url https://pypi.org/simple duckdb pyyaml
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
      - name: Extract fixed BIEN source citations
        env:
          GH_TOKEN: ${{ github.token }}
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          mkdir -p build/bien-core build/provenance
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/bien-core
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          Rscript scripts/source/extract_bien_core_source_citations_v0_5.R             --core-table build/bien-core/trait_memory_crossed_core_v0_6/core_systems.csv             --out build/provenance/bien_source_citations.csv
      - name: Download pinned AusTraits source and config
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 -o build/source/austraits.parquet             https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail -o build/source/traits.yml             https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Audit primary-source DOI overlap
        run: |
          python scripts/source/audit_austraits_bien_provenance_overlap_v0_5.py             --austraits-parquet build/source/austraits.parquet             --austraits-core build/final/core/core_systems.csv             --traits-yml build/source/traits.yml             --bien-citations build/provenance/bien_source_citations.csv             --out build/provenance/result.json
          cat build/provenance/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-provenance-v0-6-5-5
          path: build/provenance/
          retention-days: 30
