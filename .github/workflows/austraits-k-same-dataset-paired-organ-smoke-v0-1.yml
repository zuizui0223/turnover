name: AusTraits shared-dataset reproductive K native-tree smoke v0.1

on:
  push:
    branches:
      - analysis/brownian-process-null-v0-1
    paths:
      - '.github/workflows/austraits-k-same-dataset-paired-organ-smoke-v0-1.yml'
      - 'data/austraits_k_same_dataset_organ_matched_tip_sensitivity_v0_1.json'
      - 'scripts/analysis/run_austraits_k_same_dataset_pair_batch_v0_1.py'
      - 'scripts/analysis/fit_austraits_k_same_dataset_organ_pairs_v0_1.R'
      - 'tests/test_austraits_k_same_dataset_pair_batch_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  two_source_cohorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas duckdb pyyaml numpy
      - name: Retrieve source-only K eligibility and original 760 common-tip graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/source-support build/original-pairs build/source build/batch build/out
          gh run download 38696272257 -R "$GITHUB_REPOSITORY" \
            -n austraits-k-cross-trait-common-dataset-support-v0-1 -D build/source-support
          gh run download 38673955087 -R "$GITHUB_REPOSITORY" \
            -n austraits-k-shared-taxon-pair-support-v0-1 -D build/original-pairs
          test -f build/source-support/shared_dataset_source_support.json
          test -f build/original-pairs/shared_taxon_pair_support.json
      - name: Verify all 279 source-only K cohort IDs and a synthetic source-native parquet
        run: |
          python -m py_compile scripts/analysis/run_austraits_k_same_dataset_pair_batch_v0_1.py
          python tests/test_austraits_k_same_dataset_pair_batch_v0_1.py \
            --source-support build/source-support/shared_dataset_source_support.json \
            --original-pair-support build/original-pairs/shared_taxon_pair_support.json \
            --design data/austraits_k_same_dataset_organ_matched_tip_sensitivity_v0_1.json
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::Rcpp
            any::jsonlite
            any::phytools
      - name: Install locked original native plant phylogeny and validate R estimator syntax
        run: |
          Rscript -e "parse(file='scripts/analysis/fit_austraits_k_same_dataset_organ_pairs_v0_1.R')"
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Download SHA-verified original AusTraits source and unit definitions
        run: |
          curl -L --fail --retry 4 --retry-delay 10 \
            -o build/source/austraits.parquet \
            https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail -o build/source/traits.yml \
            https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Select family examples without reading ANY K direction or module outcome
        run: |
          python - <<'PY'
          import json
          src=json.load(open('build/source-support/shared_dataset_source_support.json'))
          og=json.load(open('build/original-pairs/shared_taxon_pair_support.json'))
          original={(r['family'],r['trait_A'],r['trait_B']):r
                    for r in og['family_trait_pair_support']
                    if r['qualifies_20_common_species']}
          selections=[
            ('Casuarinaceae','fruit_length','leaf_length',35),
            ('Fabaceae','fruit_length','leaf_length',1860)]
          out=[]
          for fam,a,b,n in selections:
              m=[r for r in src['cross_organ_family_trait_pair_support']
                 if (r['family'],r['trait_A'],r['trait_B'])==(fam,a,b)]
              assert len(m)==1 and m[0]['n_same_AusTraits_dataset_species']==n
              d=original[(fam,a,b)]
              out.append({**m[0],**{
                'system_A':d['system_A'],'system_B':d['system_B'],
                'n_original_A':d['n_original_A'],'n_original_B':d['n_original_B']}})
          open('build/batch/smoke.json','w').write(json.dumps(out))
          print('PASS: source-only 35 and 1,860 common-DatasetID species; no K direction selection')
          PY
      - name: Refit four native trait K states on identical SAME dataset-qualified taxa and phylogeny
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/analysis/run_austraits_k_same_dataset_pair_batch_v0_1.py \
            --batch-json build/batch/smoke.json \
            --source-support build/source-support/shared_dataset_source_support.json \
            --original-pair-support build/original-pairs/shared_taxon_pair_support.json \
            --parquet build/source/austraits.parquet \
            --traits-yml build/source/traits.yml \
            --design data/austraits_k_same_dataset_organ_matched_tip_sensitivity_v0_1.json \
            --r-script scripts/analysis/fit_austraits_k_same_dataset_organ_pairs_v0_1.R \
            --out build/out/smoke_source_arm_K.json
          python - <<'PY'
          import json
          d=json.load(open('build/out/smoke_source_arm_K.json'))
          assert d['status']=='AUSTRAITS_K_SAME_DATASET_PAIR_BATCH_COMPLETE'
          assert len(d['pairs'])==2
          assert all(x['axes']['S3']['status']=='PASS' for x in d['pairs'])
          assert all(x['n_same_source_positive_species']>=20 for x in d['pairs'])
          assert d['NOT_independent_primary_measurement_validation']
          assert d['no_species_observation_IDs_or_raw_trait_measurements_persisted']
          print('PASS: original real-tree Blomberg K kernel, one small and one large common-source family pair')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-k-same-dataset-paired-organ-smoke-v0-1
          path: build/out/smoke_source_arm_K.json
          retention-days: 30
