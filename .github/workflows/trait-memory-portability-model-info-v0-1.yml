name: Trait memory portability model informativeness v0.1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  model-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install numpy
      - name: Download frozen 201-system core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/core
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          test -f build/core/trait_memory_crossed_core_v0_6/core_systems.csv
      - name: Validate portability contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_portability_design_v0_1.json'))
          prior=json.load(open('results/trait_memory_model_informativeness_v0_6_1/result.json'))
          assert prior['status']=='HOLD_TRAIT_MEMORY_MODEL_INFORMATIVENESS'
          assert prior['real_memory_effects_opened'] is False
          assert d['status']=='FROZEN_BEFORE_REAL_TRAIT_MEMORY_OPENING'
          assert d['source_core']['expected_systems']==201
          assert d['source_core']['expected_families']==45
          assert d['source_core']['expected_traits']==12
          assert d['known_truth_gate']['benchmark_signal']['trait_variance']==0.005
          assert d['known_truth_gate']['benchmark_signal']['family_variance']==0.005
          assert d['known_truth_gate']['benchmark_null']['trait_variance']==0
          assert d['known_truth_gate']['datasets_per_benchmark']==1000
          assert d['known_truth_gate']['permutations_per_dataset']==199
          assert d['known_truth_gate']['admission']['signal_power_min']==0.80
          assert d['known_truth_gate']['admission']['null_false_positive_max']==0.06
          assert d['real_memory_effects_opened'] is False
          f=json.load(open('data/trait_memory_portability_runtime_fix_v0_1_1.json'))
          assert f['status']=='PORTABILITY_MODEL_INFO_RUNTIME_DEPENDENCY_FIX_PRE_SIMULATION'
          assert f['known_truth_datasets_simulated_before_fix']==0
          assert f['scientific_design_changed'] is False
          assert f['thresholds_changed'] is False
          PY
      - name: Run graph-only known-truth portability calibration
        run: |
          mkdir -p build/portability-model-info
          python scripts/analysis/run_trait_memory_portability_model_info_v0_1.py \
            --core-table build/core/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/portability-model-info/result.json \
            --table-out build/portability-model-info/simulations.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-portability-model-info-v0-1
          path: build/portability-model-info/
