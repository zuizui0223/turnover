name: Trait memory real effects and variance partition v0.7

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate final crossed core
        run: |
          python - <<'PY'
          import json
          c=json.load(open('results/trait_memory_crossed_core_v0_6/result.json'))
          d=json.load(open('data/trait_memory_real_effect_execution_v0_7.json'))
          assert c['status']=='TRAIT_MEMORY_CROSSED_CORE_PASS'
          assert c['gate_pass'] is True
          assert c['n_core_families']>=12
          assert c['n_core_traits']>=4
          assert c['connected'] is True
          assert d['status']=='FROZEN_BEFORE_TEMPORAL_MEMORY_EFFECT_OPENING'
          assert d['primary_model']['effective_formula']=='S3_rho ~ 1 + (1|family) + (1|trait_name)'
          assert d['bootstrap']['replicates']==2000
          assert d['bootstrap']['master_seed']==20261003
          PY
      - id: matrix
        run: |
          python - <<'PY'
          import csv,json,os
          rows=[]
          with open('results/trait_memory_crossed_core_v0_6/core_systems.csv',newline='') as fh:
              for i,r in enumerate(csv.DictReader(fh),1):
                  rows.append({
                    'id':f'R{i:04d}',
                    'family':r['family'],
                    'trait_name':r['trait_name'],
                    'semantic_class':r['semantic_class']
                  })
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY

  effect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Estimate frozen real temporal memory effect
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
          FAMILY: ${{ matrix.family }}
          TRAIT_NAME: ${{ matrix.trait_name }}
          SEMANTIC_CLASS: ${{ matrix.semantic_class }}
          SYSTEM_ID: ${{ matrix.id }}
        run: |
          mkdir -p build/effect
          Rscript scripts/analysis/run_trait_memory_real_effect_v0_7.R \
            --family "$FAMILY" --trait "$TRAIT_NAME" --class "$SEMANTIC_CLASS" --id "$SYSTEM_ID" \
            --out "build/effect/$SYSTEM_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-real-${{ matrix.id }}
          path: build/effect/${{ matrix.id }}.json
          retention-days: 30

  aggregate:
    needs: effect
    if: always() && needs.effect.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trait-memory-real-R*
          path: build/all-effects
          merge-multiple: true
      - name: Aggregate one effect per final-core system
        run: |
          mkdir -p build/real
          python scripts/analysis/aggregate_trait_memory_real_effects_v0_7.py \
            --input-dir build/all-effects \
            --core-table results/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/real/effects.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-real-effects-v0-7
          path: build/real/effects.csv

  model:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trait-memory-real-effects-v0-7
          path: build/real
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
      - name: Fit frozen crossed variance model
        run: |
          mkdir -p build/model
          Rscript scripts/analysis/fit_trait_memory_variance_partition_v0_7.R \
            --effects build/real/effects.csv \
            --out build/model/result.json \
            --bootstrap-table build/model/bootstrap.csv \
            --loo-table build/model/leave_one_out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-variance-partition-v0-7
          path: build/model/
