name: Trait memory cluster bootstrap recover v0.3

on:
  push:
    branches:
      - analysis/trait-memory-robustness-v0-3-model-fix
    paths:
      - '.github/workflows/trait-memory-cluster-bootstrap-recover-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download passed aggregate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/robust
          gh run download 37271779078 -R "$GITHUB_REPOSITORY" -n trait-memory-robust-effects-v0-3-recovered -D build/robust
          python - <<'PY'
          import json
          x=json.load(open('build/robust/aggregate_result.json'))
          assert x['status']=='TRAIT_MEMORY_ROBUST_EFFECTS_AGGREGATED'
          assert x['reference_identity']['pass'] is True
          assert x['measurement_error']['all_systems_have_valid_raw_se'] is True
          PY
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
            any::metafor
      - name: Validate exact frozen bootstrap recovery
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_robustness_design_v0_3.json'))
          a=d['technical_amendment_cluster_bootstrap_vector_type']
          assert a['scientific_change'] is False
          assert a['thresholds_changed'] is False
          assert a['resampling_changed'] is False
          assert a['seed_changed'] is False
          assert d['measurement_error']['uncertainty']['replicates']==500
          assert d['measurement_error']['uncertainty']['seed']==20261006
          assert d['measurement_error']['uncertainty']['min_success_fraction']==0.9
          PY
          Rscript -e "parse(file='scripts/analysis/fit_trait_memory_measurement_aware_v0_3.R')"
      - name: Refit frozen measurement-aware model and cluster bootstrap
        run: |
          mkdir -p build/model
          Rscript scripts/analysis/fit_trait_memory_measurement_aware_v0_3.R \
            --effects build/robust/effects_with_se_log.csv \
            --aggregate-json build/robust/aggregate_result.json \
            --out build/model/measurement_aware_result.json \
            --bootstrap-table build/model/measurement_aware_cluster_bootstrap.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-measurement-aware-v0-3-recovered
          path: build/model/
          retention-days: 30
