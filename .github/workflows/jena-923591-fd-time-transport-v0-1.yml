name: Jena 2003-07 to 2008-12 FD biomass temporal transport frozen benchmark
on:
  push:
    branches: [analysis/biomass-jena-measured-source-20261114]
    paths:
      - scripts/analysis/fit_jena_923591_fd_biomass_time_transport_v0_1.py
      - .github/workflows/jena-923591-fd-time-transport-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/fit_jena_923591_fd_biomass_time_transport_v0_1.py
      - .github/workflows/jena-923591-fd-time-transport-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy==2.3.4
      - name: Test code and fail-closed model fixture (before fitting real values)
        run: |
          python -m py_compile scripts/analysis/fit_jena_923591_fd_biomass_time_transport_v0_1.py
          python scripts/analysis/fit_jena_923591_fd_biomass_time_transport_v0_1.py --self-test
      - name: Fetch exactly byte-pinned public PANGAEA dataset 923591 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/jena_longitudinal_source
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,hashlib
          root=Path('/tmp/jena_longitudinal_source')
          expected={
            'predictors_raw.zip':'4af2ccca7b85b7a15b47ace87acfe0386feab79da51d3d5f67b3cf6034442e4b',
            'biomass02_12.zip':'aa4e4904c200e4a7d35cfd713a47969b3c08f014bccfe330cefe245ee1e875db',
            'traits.st.zip':'5ae74c473ff2e36861f137f4fc8a28740725a90dda9e265350fd45bcb38996c5'}
          for name,digest in expected.items():
            url='https://download.pangaea.de/dataset/923591/files/'+urllib.parse.quote(name)
            req=urllib.request.Request(url,headers={'User-Agent':'turnover-locked-fd-year-transport/0.1'})
            with urllib.request.urlopen(req,timeout=100) as response:
              raw=response.read(10_000_001)
            if len(raw)>10_000_000 or hashlib.sha256(raw).hexdigest()!=digest:raise ValueError('Original PANGAEA source integrity failed: '+name)
            (root/name).write_bytes(raw)
            print('SOURCE_SHA256_PASS',name,len(raw))
          url='https://store.pangaea.de/Publications/Jena_Experiment/PlotInformationMainExperiment.txt'
          req=urllib.request.Request(url,headers={'User-Agent':'turnover-locked-fd-year-transport/0.1'})
          with urllib.request.urlopen(req,timeout=100) as res:raw=res.read(100_000)
          if hashlib.sha256(raw).hexdigest()!='7b7f1af497959a77a5ddefea5148b8d784b5d1b50a19f2925f9353426a83da70':raise ValueError('Original sowing design checksum mismatch')
          (root/'JenaOriginalPlotInfo.txt').write_bytes(raw)
          PY
      - name: Recheck source-only plot-year-season identity and pre-registered missingness gates
        run: |
          python scripts/analysis/audit_jena_923591_longitudinal_join_v0_1.py \
            --predictors /tmp/jena_longitudinal_source/predictors_raw.zip \
            --biomass /tmp/jena_longitudinal_source/biomass02_12.zip \
            --plotinfo /tmp/jena_longitudinal_source/JenaOriginalPlotInfo.txt \
            --out results/biomass_jena_2003_source_v0_1/longitudinal_fd_biomass_join_qa_v0_1.json
      - name: Estimate locked within-Jena long-term trait FD/FI predictive gains
        run: |
          python scripts/analysis/fit_jena_923591_fd_biomass_time_transport_v0_1.py \
            --predictors /tmp/jena_longitudinal_source/predictors_raw.zip \
            --biomass /tmp/jena_longitudinal_source/biomass02_12.zip \
            --plotinfo /tmp/jena_longitudinal_source/JenaOriginalPlotInfo.txt \
            --tier0 results/biomass_jena_2003_source_v0_1/longitudinal_fd_biomass_join_qa_v0_1.json \
            --out results/biomass_jena_2003_source_v0_1/longitudinal_fd_biomass_time_transport_v0_1.json
      - name: Preserve only nonraw QA and model summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jena-923591-frozen-fd-longitudinal-time-transport-v0-1
          path: |
            results/biomass_jena_2003_source_v0_1/longitudinal_fd_biomass_join_qa_v0_1.json
            results/biomass_jena_2003_source_v0_1/longitudinal_fd_biomass_time_transport_v0_1.json
          if-no-files-found: ignore
          retention-days: 60
