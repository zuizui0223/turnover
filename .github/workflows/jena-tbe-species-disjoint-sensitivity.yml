name: Jena TBE strict species-disjoint post-result sensitivity
on:
  push:
    branches: [analysis/jena-tbe-pool-fox-transfer-20261127]
    paths:
      - scripts/analysis/jena_tbe2012_species_disjoint_sensitivity.py
      - .github/workflows/jena-tbe-species-disjoint-sensitivity.yml
  workflow_dispatch:
jobs:
  fixed-sensitivity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/analysis/jena_tbe2012_species_disjoint_sensitivity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jena-tbe-species-disjoint-nonraw
          path: results/jena_tbe2012_species_disjoint_sensitivity_20261127_v0_1.json
          if-no-files-found: warn
