name: BIEN temporal informativeness v0.4.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build frozen crosswalk-PASS matrix
        run: |
          python - <<'PY'
          import csv,json,os
          rows=[]
          with open('results/bien_phylogeny_crosswalk_v0_3_4/crosswalk.csv',newline='') as fh:
              for r in csv.DictReader(fh):
                  if str(r['crosswalk_pass']).strip().lower() not in {'true','t','1'}:
                      continue
                  rows.append({
                    'id':f"S{len(rows)+1:03d}",
                    'family':r['family'],
                    'trait_name':r['trait_name'],
                    'semantic_class':r['semantic_class']
                  })
          assert len(rows)==39, len(rows)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY

  temporal:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::ape
      - name: Pin BIEN and V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Validate informativeness contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/bien_informativeness_design_v0_4.json'))
          e=json.load(open('data/bien_informativeness_execution_v0_4_2.json'))
          assert d['status']=='FROZEN_BEFORE_BIEN_TRAIT_SUPPORT_RESULT_OPENING'
          assert d['canonical_effect']['benchmark_delta_rho']==0.15
          assert d['canonical_effect']['admission_thresholds']['median_absolute_recovery_error_max']==0.10
          assert d['canonical_effect']['admission_thresholds']['directional_recovery_min']==0.80
          assert d['canonical_effect']['admission_thresholds']['valid_replicate_fraction_min']==0.90
          assert e['status']=='BIEN_INFORMATIVENESS_EXECUTION_RULES_FROZEN_PRE_SIMULATION_RESULT'
          assert e['chronology']['informativeness_simulation_result_seen_before_freeze'] is False
          assert e['continuous_pair_rule']=='Use every unordered pair exactly; no pair subsampling.'
          PY
      - name: Run temporal S3 and prune-only recovery
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
          FAMILY: ${{ matrix.family }}
          TRAIT_NAME: ${{ matrix.trait_name }}
          SEMANTIC_CLASS: ${{ matrix.semantic_class }}
          SYSTEM_ID: ${{ matrix.id }}
        run: |
          mkdir -p build/temporal-info
          Rscript scripts/analysis/run_bien_temporal_informativeness_v0_4_2.R \
            --family "$FAMILY" --trait "$TRAIT_NAME" --class "$SEMANTIC_CLASS" --id "$SYSTEM_ID" \
            --out "build/temporal-info/$SYSTEM_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bien-temporal-info-${{ matrix.id }}
          path: build/temporal-info/${{ matrix.id }}.json
          retention-days: 30

  aggregate:
    needs: temporal
    if: always() && needs.temporal.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bien-temporal-info-*
          path: build/all-temporal
          merge-multiple: true
      - name: Aggregate temporal informativeness
        run: |
          mkdir -p build/bien_temporal_informativeness_v0_4_2
          python scripts/analysis/aggregate_bien_temporal_informativeness_v0_4_2.py \
            --input-dir build/all-temporal \
            --out build/bien_temporal_informativeness_v0_4_2/result.json \
            --table-out build/bien_temporal_informativeness_v0_4_2/temporal_informativeness.csv
      - name: Enforce outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/bien_temporal_informativeness_v0_4_2/result.json'))
          assert x['outcome_blind'] is True
          assert x['real_trait_values_opened'] is False
          assert x['biological_turnover_outcomes_opened'] is False
          assert x['n_candidate_systems']==39
          assert x['status'] in {'BIEN_TEMPORAL_INFORMATIVENESS_PASS','HOLD_BIEN_TEMPORAL_INFORMATIVENESS'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bien-temporal-informativeness-v0-4-2
          path: build/bien_temporal_informativeness_v0_4_2/
