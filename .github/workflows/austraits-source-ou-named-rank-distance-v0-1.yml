name: AusTraits source-OU named rank profile distance v0.1

on:
  push:
    branches:
      - analysis/brownian-process-null-v0-1
    paths:
      - '.github/workflows/austraits-source-ou-named-rank-distance-v0-1.yml'
      - 'scripts/analysis/audit_austraits_source_ou_named_rank_distance_v0_1.py'
      - 'tests/test_austraits_source_ou_named_rank_distance_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exploratory_profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy
      - name: Synthetic full graph and nonprimary diagnostic tests
        run: |
          python -m py_compile scripts/analysis/audit_austraits_source_ou_named_rank_distance_v0_1.py
          python tests/test_austraits_source_ou_named_rank_distance_v0_1.py
      - name: Recover immutable 249-system simulation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/input build/K build/result
          for i in $(seq -w 1 16); do
            gh run download 37785257795 -R "$GITHUB_REPOSITORY" -n "austraits-source-ou-sim-B${i}" -D build/input
          done
          gh run download 37725935020 -R "$GITHUB_REPOSITORY" -n austraits-blomberg-k-effects-v0-1 -D build/K
          test "$(find build/input -maxdepth 1 -name '*.json' | wc -l)" -eq 249
      - name: Test full 12-dimensional empirical named-rank profile against frozen OU plus source models
        run: |
          python scripts/analysis/audit_austraits_source_ou_named_rank_distance_v0_1.py \
            --input-dir build/input \
            --observed-K build/K/effects.csv \
            --out build/result/named_rank_distance.json
          python - <<'PY'
          import json,math
          z=json.load(open('build/result/named_rank_distance.json'))
          assert z['status']=='AUSTRAITS_SOURCE_OU_NAMED_RANK_DISTANCE_EXPLORATORY_V0_1'
          assert z['post_source_ou_outcome_exploratory'] is True
          assert z['fixed_graph']=={'systems':249,'families':42,'traits':12}
          for m in ('trait_global','system_local'):
              for c in ('c0p25','c1','c4'):
                  for a in ('S3','prune_only'):
                      d=z['models'][m][c][a]
                      assert len(d['named_traits'])==12
                      assert math.isfinite(d['observed_named_rank_squared_distance'])
                      assert 1/257<=d['descriptive_p_null_ge_observed']<=1
          print('PASS: all 12 source-OU named-rank profile adequacy checks')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-source-ou-named-rank-distance-v0-1
          path: build/result/named_rank_distance.json
          retention-days: 30
