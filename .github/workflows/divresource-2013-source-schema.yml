name: DivResource 2013 original author source schema
on:
  push:
    branches: [analysis/divresource-pool-transfer-20261126]
    paths:
      - scripts/source/divresource_2013_original_schema.py
      - .github/workflows/divresource-2013-source-schema.yml
  workflow_dispatch:
jobs:
  original-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/source/divresource_2013_original_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: divresource-2013-source-schema-nonraw
          path: results/divresource_2013_source_schema_v0_1.json
          if-no-files-found: error
