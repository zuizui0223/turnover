name: BIODEPTH 2010 original biomass plus GIFT source-pinned height FD site holdout
on:
  push:
    branches: [analysis/biodepth-2010-species-pool-audit-20261115]
    paths:
      - scripts/analysis/fit_biodepth_2010_sown_height_fd_biomass_v0_1.py
      - .github/workflows/biodepth-2010-gift-height-fd-holdout-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/fit_biodepth_2010_sown_height_fd_biomass_v0_1.py
      - .github/workflows/biodepth-2010-gift-height-fd-holdout-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gated-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen minimal numpy numerical dependency and verify model matrix
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.3.4
          python3 -m py_compile scripts/analysis/fit_biodepth_2010_sown_height_fd_biomass_v0_1.py
          python3 scripts/analysis/fit_biodepth_2010_sown_height_fd_biomass_v0_1.py --self-test
      - name: Check previously audited original GIFT reference source fingerprint and PASS, no biomass opened
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json")
          obj=json.loads(p.read_text())
          if obj["status"]!="GIFT_HEIGHT_REFERENCE_PROVENANCE_PASS" or obj["original_species_with_full_references_and_no_explicit_original_BIODEPTH"]!=88 or obj["bibliography_eligible_original_plots"]!=174:
              raise SystemExit("SOURCE_GIFT_BIBLIOGRAPHY_NOT_AUDITED_PASS")
          print("PROSPECTIVE_SOURCE_BIBLIOGRAPHY_PASS",obj["GIFT_original_target_species_height_and_reference_fingerprint_sha256"])
          PY
      - name: Fetch original Hector 2010 response and species/biogeographic data plus original 2005 sowing design (SHA pinned)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          import hashlib
          root=Path("/tmp/BIODEPTH_original_2010_fd_qa");root.mkdir(parents=True,exist_ok=True)
          sources={
            "species2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesBiomass.txt",
               "ebe677c639ef4603bc1ed50d49e7440588683e7696be230c0cbfff7d6b22b816"),
            "codes2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesCodes.txt",
               "02ad483f727d4d10c10be7e7fe83e9e66c42803d6d08956d9397001dbf32f11b"),
            "community2010.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthBiomass.txt",
               "9d95e65295bf6014e753f474dffa09036718b6b54ad5e1d4eea41c1dde76f886"),
            "sown2005.txt":("https://ndownloader.figshare.com/files/5640240",
               "a3029e18937b577aa2dafd9efb31fc50bf8fa39a0c1b48bca7c493cc6013cc7a")}
          for name,(u,sha) in sources.items():
              r=Request(u,headers={"User-Agent":"turnover-BIODEPTH-original-2010-height-FD-biomass/0.1"})
              with urlopen(r,timeout=105) as resp:raw=resp.read(2_000_001)
              if len(raw)>2_000_000 or hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError("Original 2010 source file changed:"+name)
              (root/name).write_bytes(raw)
              print("PINNED_BIODEPTH_SOURCE_PASS",name,len(raw),sha)
          PY
      - name: Run frozen 7-site out-of-field GIFT maximum-height dispersion and mean-height predictive contrasts
        run: |
          python3 scripts/analysis/fit_biodepth_2010_sown_height_fd_biomass_v0_1.py \
            --species /tmp/BIODEPTH_original_2010_fd_qa/species2010.txt \
            --codes /tmp/BIODEPTH_original_2010_fd_qa/codes2010.txt \
            --design /tmp/BIODEPTH_original_2010_fd_qa/sown2005.txt \
            --community /tmp/BIODEPTH_original_2010_fd_qa/community2010.txt \
            --provenance results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json \
            --out results/biodepth_2010_species_source_v0_1/height_pairwise_dispersion_biomass_site_holdout_v0_1.json
      - name: Preserve only source-fingerprinted post-result prediction summary without copyrighted raw original data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biodepth-2010-gift-103taxa-height-fd-biomass-site-holdout-v0-1
          path: results/biodepth_2010_species_source_v0_1/height_pairwise_dispersion_biomass_site_holdout_v0_1.json
          if-no-files-found: ignore
          retention-days: 30
