name: BIODEPTH original 2010 guild-conditioned species-height label null
on:
  push:
    branches:
      - analysis/biodepth-guild-conditioned-height-label-null-20261116
    paths:
      - scripts/analysis/test_biodepth_height_label_guild_null_v0_1.py
      - docs/BIODEPTH_HEIGHT_TRAIT_LABEL_RANDOMIZATION_DESIGN_V0_1.md
      - .github/workflows/biodepth-guild-conditioned-height-label-null-v0-1.yml
  pull_request:
    paths:
      - scripts/analysis/test_biodepth_height_label_guild_null_v0_1.py
      - docs/BIODEPTH_HEIGHT_TRAIT_LABEL_RANDOMIZATION_DESIGN_V0_1.md
      - .github/workflows/biodepth-guild-conditioned-height-label-null-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-guild-label-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frozen design, syntax and exact-source-free fixture
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.3.4
          python -m py_compile scripts/analysis/test_biodepth_height_label_guild_null_v0_1.py
          python scripts/analysis/test_biodepth_height_label_guild_null_v0_1.py --self-test
          test -s docs/BIODEPTH_HEIGHT_TRAIT_LABEL_RANDOMIZATION_DESIGN_V0_1.md
      - name: Verify signed historical archive gates without reading biological rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/biodepth_2010_species_source_v0_1")
          saved=json.loads((p/"gift_height_103taxa_bibliography_qa_v0_1.json").read_text())
          historical=json.loads((p/"height_pairwise_dispersion_biomass_site_holdout_v0_1.json").read_text())
          corrected=json.loads((p/"origanum_botanical_height_source_correction_summary_v0_1.json").read_text())
          assert saved["status"]=="GIFT_HEIGHT_REFERENCE_PROVENANCE_PASS"
          assert historical["population"]["provenance_quality_eligible_plots"]==174
          assert corrected["n_original_plots"]==174
          assert corrected["comparison"]["Kew_0_90m"]["positive_sites"]==4
          print("PRIOR_SOURCE_GATE_PASS: 88 height taxa; 174 original plots; Kew 0.9m correction preserved")
          PY
      - name: Fetch original research-source bytes with immutable SHA256 (no copyrighted rows committed)
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          folder=Path("/tmp/BIODEPTH_2010_guild_permutation")
          folder.mkdir(parents=True,exist_ok=True)
          src={
            "species.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesBiomass.txt",
              "ebe677c639ef4603bc1ed50d49e7440588683e7696be230c0cbfff7d6b22b816"),
            "codes.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthSpeciesCodes.txt",
              "02ad483f727d4d10c10be7e7fe83e9e66c42803d6d08956d9397001dbf32f11b"),
            "community.txt":("https://esapubs.org/archive/ecol/E091/155/BiodepthBiomass.txt",
              "9d95e65295bf6014e753f474dffa09036718b6b54ad5e1d4eea41c1dde76f886"),
            "design.txt":("https://ndownloader.figshare.com/files/5640240",
              "a3029e18937b577aa2dafd9efb31fc50bf8fa39a0c1b48bca7c493cc6013cc7a")}
          for name,(url,expected) in src.items():
            request=urllib.request.Request(url,headers={"User-Agent":"turnover-BIODEPTH-source-guild-label-permutation-20261116/0.1"})
            with urllib.request.urlopen(request,timeout=110) as response: raw=response.read(2_000_001)
            if len(raw)>2_000_000 or hashlib.sha256(raw).hexdigest()!=expected:
              raise ValueError("SOURCE_HOLD: source raw bytes mismatch for "+name)
            (folder/name).write_bytes(raw)
            print("ORIGINAL_SOURCE_SHA_PASS",name,len(raw))
          PY
      - name: Replay observed source and run 999 frozen within-guild species-label nulls
        run: |
          python scripts/analysis/test_biodepth_height_label_guild_null_v0_1.py \
            --species /tmp/BIODEPTH_2010_guild_permutation/species.txt \
            --codes /tmp/BIODEPTH_2010_guild_permutation/codes.txt \
            --community /tmp/BIODEPTH_2010_guild_permutation/community.txt \
            --design /tmp/BIODEPTH_2010_guild_permutation/design.txt \
            --provenance results/biodepth_2010_species_source_v0_1/gift_height_103taxa_bibliography_qa_v0_1.json \
            --prior results/biodepth_2010_species_source_v0_1/height_pairwise_dispersion_biomass_site_holdout_v0_1.json \
            --corrected results/biodepth_2010_species_source_v0_1/origanum_botanical_height_source_correction_summary_v0_1.json \
            --out build/biodepth_2010_guild_height_species_label_null_v0_1.json
      - name: Upload aggregate-only result and preserve fail-closed source HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biodepth-2010-guild-conditioned-height-label-null-aggregate
          path: build/biodepth_2010_guild_height_species_label_null_v0_1.json
          if-no-files-found: ignore
          retention-days: 30
