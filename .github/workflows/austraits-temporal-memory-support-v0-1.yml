name: AusTraits temporal-memory support v0.1
on:
  pull_request:
    paths:
      - 'data/austraits_temporal_memory_replication_design_v0_1.json'
      - 'scripts/source/audit_austraits_temporal_memory_support_v0_1.py'
      - '.github/workflows/austraits-temporal-memory-support-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install duckdb
      - name: Download exact AusTraits v7
        run: |
          mkdir -p build/austraits-repl
          curl -L --fail --retry 4 --retry-delay 10 -o build/austraits-repl/austraits.parquet \
            https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/austraits-repl/austraits.parquet" | sha256sum -c -
      - name: Validate replication boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/austraits_temporal_memory_replication_design_v0_1.json'))
          assert d['status']=='FROZEN_BEFORE_AUSTRAITS_TEMPORAL_MEMORY_EFFECT_OPENING'
          assert d['temporal_eligibility']['minimum_species_per_family_trait']==20
          assert d['replication_graph']['minimum_families']==12
          assert d['replication_graph']['minimum_traits']==4
          assert d['raw_trait_effects_opened'] is False
          PY
      - name: Count source-native temporal support
        run: |
          python scripts/source/audit_austraits_temporal_memory_support_v0_1.py \
            --parquet build/austraits-repl/austraits.parquet \
            --out build/austraits-repl/result.json \
            --table-out build/austraits-repl/support.csv
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-temporal-memory-support-v0-1
          path: |
            build/austraits-repl/result.json
            build/austraits-repl/support.csv
