name: Jena direct FI-FD and paired seasonal contrast validation v0.1
on:
  pull_request:
    paths:
      - scripts/analysis/validate_jena_direct_contrasts_v0_1.py
      - scripts/qa/test_jena_direct_contrasts_v0_1.py
      - .github/workflows/jena-direct-contrasts-validation-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jena-direct-contrasts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed statistical dependencies
        run: python -m pip install -q numpy==2.3.4 pandas==2.2.3 scipy==1.16.3 statsmodels==0.14.5 pytest==8.4.2
      - name: Verify direct contrast algebra and resampling implementation
        run: |
          python -m py_compile scripts/analysis/validate_jena_direct_contrasts_v0_1.py
          python -m pytest -q scripts/qa/test_jena_direct_contrasts_v0_1.py
      - name: Independently reproduce original effects and calculate paired contrasts
        run: |
          python scripts/analysis/validate_jena_direct_contrasts_v0_1.py \
            --source-dir /tmp/jena_direct_contrast_source \
            --out results/biomass_jena_2003_source_v0_1/direct_contrast_validation_v0_1.json
      - name: Save only nonraw validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jena-direct-fd-fi-season-contrast-validation-v0-1
          path: results/biomass_jena_2003_source_v0_1/direct_contrast_validation_v0_1.json
          if-no-files-found: ignore
          retention-days: 60
