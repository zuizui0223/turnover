name: Validate TreeDivNet Wiley supplementary source HOLD and DS2 richness identity
on:
  push:
    branches: [analysis/treedivnet-2026-source-plot-join-20261116]
    paths:
      - results/treedivnet_2026_supplement_and_woody_reconciliation_v0_3.json
      - docs/TREEDIVNET_WILEY_SUPPLEMENT_AND_WOODY_SOURCE_RECONCILIATION_RESULTS_V0_3.md
      - .github/workflows/treedivnet-wiley-supplement-woody-reconciliation-integrity-v0-3.yml
  pull_request:
    paths:
      - results/treedivnet_2026_supplement_and_woody_reconciliation_v0_3.json
      - docs/TREEDIVNET_WILEY_SUPPLEMENT_AND_WOODY_SOURCE_RECONCILIATION_RESULTS_V0_3.md
      - .github/workflows/treedivnet-wiley-supplement-woody-reconciliation-integrity-v0-3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate source runs, 328 plot mathematics and preserved source HOLD
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          src=Path('results/treedivnet_2026_supplement_and_woody_reconciliation_v0_3.json')
          prior=Path('results/treedivnet_2026_original_DS1_DS2_plot_source_gate_v0_2.json')
          r=json.loads(src.read_text())
          p=json.loads(prior.read_text())
          assert r['original_source_only'] is True and r['ecological_effects_fit']==0
          assert r['status']=='PLOT_JOIN_PASS__SOURCE_MEASUREMENT_TIMING_AND_WOODY_SCALING_HOLD'
          assert p['audits']['original_source_join']['source_joined_unique_site_block_plot']==328
          assert p['audits']['original_source_join']['geometry_status']=='SOURCE_JOIN_GEOMETRY_PASS'
          assert p['audits']['original_source_join']['plots_with_2plus_identical_axis_species_and_valid_DS1_woody_biomass']==186
          d=r['audit_reports']['richness_denominator_check']
          a=d['source_arithmetic_counts']
          assert a['joined_plots']==328
          assert a['DS2_mean_equals_DS1']==321
          assert a['DS2_sum_equals_DS1']==135
          assert a['DS2_sum_over_original_richness_equals_DS1']==321
          assert a['rowcount_equal_original_richness']==322
          assert d['remaining_plots_when_sum_div_original_richness_not_equal_DS1']['n_remaining_bad_plots']==7
          assert d['original_richness_vs_species_row_count_mismatch']['reported_richness_not_equal_DS2_rows']==6
          assert d['original_richness_vs_species_row_count_mismatch']['difference_resolved_by_original_richness_denominator']==0
          assert d['no_trait_FD_K_PD_or_biomass_effect_estimated'] is True
          assert d['verified_artifact_id']==14227206669
          assert d['verified_artifact_sha256']=='sha256:440e36e925a09e72835db4c47db07a4cd965d6ef56daa7f7fd62c845be016633'
          sup=r['audit_reports']['supplement_and_readme']
          assert sup['original_figshare_readme']['readme_source_MD5']=='8fd3551d0a2b69fb9dca54b7cdbca422'
          assert sup['original_figshare_readme']['mentions_original_measurement_year'] is False
          assert sup['original_figshare_readme']['mentions_biomass_species_row_scaling_formula'] is False
          assert sup['original_DS1_DS2_time_alignment']=='TEMPORAL_ALIGNMENT_HOLD'
          assert sup['individual_DS2_original_trait_provenance']=='INDIVIDUAL_SOURCE_PROVENANCE_HOLD'
          for file in sup['official_publisher_supplement'].values():
              assert file['status']=='PUBLISHER_SUPPLEMENT_ACCESS_HOLD'
              assert [a['result'] for a in file['publisher_access_probes']]==[403,403]
          assert sup['verified_artifact_id']==14227450972
          assert sup['verified_artifact_sha256']=='sha256:77559918aa11afcc3987f3256724d2ce2053bfb8e4dbdffc78b6a9a331105d25'
          doc=Path('docs/TREEDIVNET_WILEY_SUPPLEMENT_AND_WOODY_SOURCE_RECONCILIATION_RESULTS_V0_3.md').read_text()
          for mark in ('321/328','135/328','HTTP 403','biomass–trait measurement timing','Do not','HOLD','186'):
              assert mark in doc,mark
          print('SOURCE_AND_NUMERIC_IDENTITY_INTEGRITY_PASS: 328 plot joins, 321 mean/denom, 7 remaining, Wiley files 403; no ecological effects')
          PY
