name: DivResource 2013 post SE result Fox component transfer
on:
  push:
    branches: [analysis/divresource-pool-transfer-20261126]
    paths:
      - scripts/analysis/divresource_2013_fox_component_transfer.py
      - .github/workflows/divresource-2013-fox-components.yml
  workflow_dispatch:
jobs:
  fixed-fox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/analysis/divresource_2013_fox_component_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: divresource-fixed-fox-component-aggregate
          path: results/divresource_2013_fox_components_20261127_v0_1.json
          if-no-files-found: warn
