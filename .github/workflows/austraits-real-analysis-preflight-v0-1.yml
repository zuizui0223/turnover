name: AusTraits real-analysis preflight v0.1

on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-real-analysis-preflight-v0-1.yml'
      - 'scripts/analysis/run_austraits_real_effect_batch_v0_1.py'
      - 'scripts/analysis/run_austraits_real_effect_system_v0_1.R'
      - 'scripts/analysis/aggregate_austraits_real_effects_v0_1.py'
      - 'scripts/analysis/fit_austraits_family_repeatability_v0_1.R'
      - 'scripts/analysis/test_austraits_absolute_portability_v0_1.py'
      - 'scripts/analysis/test_austraits_rank_portability_v0_1.py'
      - 'scripts/analysis/test_austraits_rank_scale_v0_2.py'
      - 'scripts/analysis/summarize_austraits_rank_reordering_v0_1.py'
      - 'scripts/analysis/screen_austraits_positive_numeric_core_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy duckdb pyyaml
      - uses: r-lib/actions/setup-r@v2
      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/analysis/run_austraits_real_effect_batch_v0_1.py \
            scripts/analysis/aggregate_austraits_real_effects_v0_1.py \
            scripts/analysis/screen_austraits_positive_numeric_core_v0_1.py \
            scripts/analysis/test_austraits_absolute_portability_v0_1.py \
            scripts/analysis/test_austraits_rank_portability_v0_1.py \
            scripts/analysis/test_austraits_rank_scale_v0_2.py \
            scripts/analysis/summarize_austraits_rank_reordering_v0_1.py
      - name: R syntax
        run: |
          Rscript -e "parse(file='scripts/analysis/run_austraits_real_effect_system_v0_1.R'); parse(file='scripts/analysis/fit_austraits_family_repeatability_v0_1.R')"
      - name: Build synthetic crossed effects
        run: |
          mkdir -p build/mock
          python - <<'PY'
          import csv,math
          rows=[]
          fams=[f'F{i:02d}' for i in range(1,13)]
          traits=[f'T{i}' for i in range(1,6)]
          for i,f in enumerate(fams):
            for j,t in enumerate(traits):
              base=-0.08+0.04*j
              interaction=0.035*math.sin((i+1)*(j+2))
              s3=base+interaction+0.004*i
              pr=base+0.85*interaction+0.003*i
              # Positive log-scale mock differs slightly but keeps same graph.
              sl=s3+0.012*math.cos(i+j)
              pl=pr+0.010*math.cos(i+2*j)
              rows.append(dict(
                system_id=f'A{len(rows)+1:04d}',family=f,trait_name=t,config_type='numeric',
                S3_rho=s3,prune_only_rho=pr,S3_raw_rho=s3,prune_raw_rho=pr,
                log_domain_pass=True,S3_log_rho=sl,prune_log_rho=pl,
                n_species_S3=30,n_species_prune=25
              ))
          with open('build/mock/effects.csv','w',newline='') as fh:
            w=csv.DictWriter(fh,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          with open('build/mock/matched.csv','w',newline='') as fh:
            w=csv.DictWriter(fh,fieldnames=['family','trait_name']);w.writeheader()
            for r in rows:w.writerow({'family':r['family'],'trait_name':r['trait_name']})
          PY
      - name: Exercise prospective Python analysis chain
        run: |
          python scripts/analysis/test_austraits_absolute_portability_v0_1.py \
            --effects build/mock/effects.csv --out build/mock/abs.json \
            --predictions build/mock/abs_pred.csv --permutations 99 --seed 1
          python scripts/analysis/test_austraits_rank_portability_v0_1.py \
            --effects build/mock/effects.csv --out build/mock/rank.json \
            --permutations 99 --seed 1
          python scripts/analysis/summarize_austraits_rank_reordering_v0_1.py \
            --effects build/mock/effects.csv --rank-portability build/mock/rank.json \
            --out build/mock/reorder.json
          python scripts/analysis/test_austraits_rank_scale_v0_2.py \
            --effects build/mock/effects.csv --matched-core build/mock/matched.csv \
            --out build/mock/scale.json --permutations 99 --seed 1
      - name: Validate chained schemas
        run: |
          python - <<'PY'
          import json
          a=json.load(open('build/mock/abs.json'))
          r=json.load(open('build/mock/rank.json'))
          z=json.load(open('build/mock/reorder.json'))
          s=json.load(open('build/mock/scale.json'))
          for x in (a,r):
            assert 'S3' in x and 'prune_only' in x
            assert 'gain' in x['S3'] and 'p_one_sided' in x['S3'] and 'axis_pass' in x['S3']
          assert z['decision'] in {
            'GLOBAL_SPECTRUM_PLUS_STRONG_REORDERING_REPLICATED',
            'GLOBAL_SPECTRUM_PLUS_SUBSTANTIAL_REORDERING_REPLICATED',
            'GLOBAL_SPECTRUM_REPLICATED_REORDERING_LIMITED_OR_AXIS_SENSITIVE',
            'GLOBAL_SPECTRUM_PORTABILITY_NOT_REPLICATED'
          }
          assert s['scale_decision'] in {'SCALE_ROBUST','SCALE_SENSITIVE'}
          assert s['n_systems']==60 and s['n_families']==12 and s['n_traits']==5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-real-analysis-preflight-v0-1
          path: build/mock/
