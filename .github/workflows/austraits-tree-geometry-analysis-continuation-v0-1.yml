name: AusTraits tree-geometry analysis continuation v0.1

on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-tree-geometry-analysis-continuation-v0-1.yml'
      - 'scripts/analysis/fit_austraits_tree_geometry_context_v0_1.R'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download completed geometry batches and frozen effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/all build/effects build/result
          gh run download 37615577295 -R "$GITHUB_REPOSITORY" -p 'austraits-tree-geometry-G*' -D build/all
          gh run download 37561484157 -R "$GITHUB_REPOSITORY" -n austraits-real-effects-v0-1 -D build/effects
          test -f build/effects/effects.csv
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Aggregate completed geometry
        run: |
          find build/all -name '*.json' -type f -exec cp {} build/result/ \;
          python scripts/analysis/aggregate_austraits_tree_geometry_v0_1.py             --input-dir build/result --out build/result/tree_geometry.csv
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::lme4
      - name: Fit fixed family-trait geometry sensitivity
        run: |
          Rscript scripts/analysis/fit_austraits_tree_geometry_context_v0_1.R             --effects build/effects/effects.csv             --geometry build/result/tree_geometry.csv             --out build/result/result.json
          cat build/result/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-family-context-tree-geometry-continuation-v0-1
          path: |
            build/result/result.json
            build/result/tree_geometry.csv
          retention-days: 30
