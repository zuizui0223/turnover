name: Trait memory source composition sensitivity v0.1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RPostgreSQL
            any::DBI
            any::jsonlite
            any::lme4
      - name: Download frozen 201-system effects and core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/effects build/core
          gh run download 37095981751 -R "$GITHUB_REPOSITORY" -n trait-memory-repeatability-real-effects-batched-v0-2-1 -D build/effects
          gh run download 37086693588 -R "$GITHUB_REPOSITORY" -n trait-memory-informativeness-v0-5 -D build/core
          test -f build/effects/effects.csv
          test -f build/core/trait_memory_crossed_core_v0_6/core_systems.csv
      - name: Pin RBIEN
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/bmaitner/RBIEN.git build/RBIEN
          git -C build/RBIEN checkout 531cb221bd44cf43419e89b2354f6424e718cd53
      - name: Validate post-outcome sensitivity contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/trait_memory_source_composition_sensitivity_v0_1.json'))
          assert d['status']=='POST_OUTCOME_SENSITIVITY_FROZEN_BEFORE_SOURCE_COMPOSITION_RESULT'
          assert d['role'].startswith('Post-outcome sensitivity only')
          assert d['provenance_unit']['primary']=='source'
          assert d['provenance_unit']['sensitivity']=='source_citation'
          assert d['no_posthoc_selection'] is True
          PY
      - name: Run source-composition audit
        env:
          RBIEN_SOURCE_DIR: build/RBIEN
        run: |
          mkdir -p build/source-sensitivity
          Rscript scripts/analysis/test_trait_memory_source_composition_v0_1.R \
            --effects build/effects/effects.csv \
            --core build/core/trait_memory_crossed_core_v0_6/core_systems.csv \
            --out build/source-sensitivity/result.json \
            --table-out build/source-sensitivity/system_provenance.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trait-memory-source-composition-v0-1
          path: build/source-sensitivity/
