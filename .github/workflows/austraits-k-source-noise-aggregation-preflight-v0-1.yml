name: AusTraits source-OU 249-system aggregation preflight v0.1

on:
  push:
    branches:
      - analysis/brownian-process-null-v0-1
    paths:
      - '.github/workflows/austraits-k-source-noise-aggregation-preflight-v0-1.yml'
      - 'tests/test_austraits_k_source_noise_aggregation_v0_1.py'
      - 'scripts/analysis/aggregate_austraits_k_source_noise_ou_v0_1.py'
      - 'scripts/analysis/aggregate_austraits_k_shared_ou_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy
      - name: Exercise all source/alpha/model graph identities with complete synthetic 249-system simulation
        run: |
          python -m py_compile scripts/analysis/aggregate_austraits_k_source_noise_ou_v0_1.py tests/test_austraits_k_source_noise_aggregation_v0_1.py
          python tests/test_austraits_k_source_noise_aggregation_v0_1.py
