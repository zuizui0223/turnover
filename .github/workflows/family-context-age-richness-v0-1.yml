name: Exploratory family context age and richness v0.1
on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/family-context-age-richness-v0-1.yml'
      - 'data/family_context_age_richness_design_v0_1.json'
      - 'scripts/analysis/test_family_context_age_richness_v0_1.R'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download source effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/bien build/aus
          gh run download 37402668768 -R "$GITHUB_REPOSITORY" -n trait-memory-positive-only-cleaning-impact-v0-2 -D build/bien
          gh run download 37561484157 -R "$GITHUB_REPOSITORY" -n austraits-real-effects-v0-1 -D build/aus
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ape
            any::lme4
      - name: Pin V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - run: |
          mkdir -p build/result
          Rscript scripts/analysis/test_family_context_age_richness_v0_1.R \
            --bien build/bien/cleaned-201/effects_positive_only_cleaned.csv \
            --austraits build/aus/effects.csv \
            --out build/result/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: family-context-age-richness-v0-1
          path: build/result/result.json
