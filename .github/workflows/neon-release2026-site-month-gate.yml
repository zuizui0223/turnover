name: NEON 2026 site-month biomass and cover catalog gate
on:
  push:
    branches: [analysis/neon-multisite-biomass-coverage-gate-20261114]
    paths:
      - scripts/analysis/audit_neon_2026_biomass_cover_site_months_v0_1.py
      - .github/workflows/neon-release2026-site-month-gate.yml
  pull_request:
    paths:
      - scripts/analysis/audit_neon_2026_biomass_cover_site_months_v0_1.py
      - .github/workflows/neon-release2026-site-month-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source gate syntax
        run: python3 -m py_compile scripts/analysis/audit_neon_2026_biomass_cover_site_months_v0_1.py
      - name: Compute fixed RELEASE-2026 multi-site calendar overlap from NEON official API
        run: |
          python3 scripts/analysis/audit_neon_2026_biomass_cover_site_months_v0_1.py \
            --out results/neon_2026_fd_biomass_source_v0_1/catalog_overlap.json
      - name: Preserve only release-pinned source-only site-month counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-release2026-biomass-cover-source-site-month-v0-1
          path: results/neon_2026_fd_biomass_source_v0_1/catalog_overlap.json
          if-no-files-found: ignore
          retention-days: 30
