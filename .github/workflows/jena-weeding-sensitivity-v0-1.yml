name: Jena 2003 weeding quadrat sensitivity v0.1
on:
  pull_request:
    paths:
      - scripts/analysis/jena_weeding_v0_1/**
      - docs/JENA_2003_WEEDING_SENSITIVITY_V0_1.md
      - .github/workflows/jena-weeding-sensitivity-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared analysis and validation dependencies
        run: python -m pip install --disable-pip-version-check -q -r scripts/analysis/jena_weeding_v0_1/requirements.txt
      - name: Validate all 13 source and statistical tests
        run: |
          set -euo pipefail
          mkdir -p results/jena_weeding_sensitivity_v0_1
          PYTHONPATH=scripts/analysis/jena_weeding_v0_1 python -m pytest -q scripts/analysis/jena_weeding_v0_1/tests | tee results/jena_weeding_sensitivity_v0_1/tests.txt
      - name: Retrieve exact public source and estimate paired quadrat sensitivity
        run: |
          set -euo pipefail
          python scripts/analysis/jena_weeding_v0_1/weeding_sensitivity.py \
            --download --data-dir /tmp/jena_2003_weeding_sources \
            --out results/jena_weeding_sensitivity_v0_1/weeding_sensitivity.json \
            | tee results/jena_weeding_sensitivity_v0_1/execution_log.txt
          sha256sum /tmp/jena_2003_weeding_sources/biomass2003.tab /tmp/jena_2003_weeding_sources/plotinfo.txt > results/jena_weeding_sensitivity_v0_1/source_sha256.txt
          python -m pip freeze > results/jena_weeding_sensitivity_v0_1/environment.txt
      - name: Preserve nonraw estimates and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jena-2003-weeding-sensitivity-v0-1
          path: results/jena_weeding_sensitivity_v0_1/
          if-no-files-found: error
          retention-days: 60
      - name: Attribute unchanged public input bytes for reproducibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/jena_2003_weeding_sources/SOURCE_ATTRIBUTION.txt')
          p.write_text('Buchmann, Nina; Temperton, Vicky M (2015). Aboveground community and species-specific plant biomass from the Jena Experiment (Main Experiment, year 2003). PANGAEA. https://doi.org/10.1594/PANGAEA.846317\nLicense: Creative Commons Attribution 3.0 Unported (CC BY 3.0), https://creativecommons.org/licenses/by/3.0/\nbiomass2003.tab is unchanged publisher TSV content, renamed only for the analysis interface.\nplotinfo.txt is the unchanged original ancillary plot allocation file from https://store.pangaea.de/Publications/Jena_Experiment/PlotInformationMainExperiment.txt\nNo raw input file is committed to the repository. This short-lived artifact prevents loss of verified source bytes when the analysis environment cannot access the publisher.\n',encoding='utf-8')
          PY
      - name: Retain public source inputs separately without committing them
        uses: actions/upload-artifact@v4
        with:
          name: jena-2003-verified-public-source-inputs-v0-1
          path: /tmp/jena_2003_weeding_sources/
          if-no-files-found: error
          retention-days: 14
