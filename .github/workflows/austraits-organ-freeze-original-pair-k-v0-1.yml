name: Preserve all original AusTraits 760 matched R K outputs v0.1
on:
  push:
    branches: [paper/austraits-organ-ecology-v0-2]
    paths:
      - .github/workflows/austraits-organ-freeze-original-pair-k-v0-1.yml
      - scripts/publication/freeze_austraits_organ_original_pair_k_v0_1.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive-original-comparison-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve all 24 original real-tree K batches before 14 November expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/original-pairK
          for i in $(seq -w 1 24); do
            gh run download 38674635870 -R "$GITHUB_REPOSITORY" \
              -n "austraits-k-matched-taxon-B$i-v0-1" \
              -D build/original-pairK
          done
          test "$(find build/original-pairK -maxdepth 1 -name 'B*.json' | wc -l)" -eq 24
      - name: Audit all original real-tree K comparisons against permanently frozen source support
        run: |
          python scripts/publication/freeze_austraits_organ_original_pair_k_v0_1.py \
            --source build/original-pairK \
            --references results/austraits_organ_paper_frozen_rebuild_inputs_v0_1 \
            --out-dir results/austraits_organ_paper_original_pair_K_v0_1
      - name: Permanently commit only original nonraw R K comparisons and SHA256 manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/austraits_organ_paper_original_pair_K_v0_1/
          if git diff --cached --quiet; then
            echo ORIGINAL_PAIR_K_ARCHIVE_ALREADY_IDENTICAL
          else
            git commit -m "Permanently freeze original 760 matched-tip R K pair outputs"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-organ-original-760-K-regression-reference-manifest-v0-1
          path: results/austraits_organ_paper_original_pair_K_v0_1/original_pair_k_reference_manifest.json
          retention-days: 90
          if-no-files-found: error
