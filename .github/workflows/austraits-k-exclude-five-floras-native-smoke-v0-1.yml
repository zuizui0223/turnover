name: AusTraits five-flora-excluded matched K native-tree smoke v0.1

on:
  push:
    branches:
      - analysis/brownian-process-null-v0-1
    paths:
      - '.github/workflows/austraits-k-exclude-five-floras-native-smoke-v0-1.yml'
      - 'scripts/analysis/fit_austraits_k_five_flora_exclusion_pairs_v0_1.R'
      - 'scripts/analysis/run_austraits_k_five_flora_exclusion_batch_v0_1.py'
      - 'tests/test_austraits_k_five_flora_exclusion_batch_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  two_source_cohorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas duckdb pyyaml numpy
      - name: Recover original frozen 283 K-blind nonflora pairs and 760 original common-tip source cohorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/flora-exclusion build/original build/source build/batch build/out
          gh run download 38920414545 -R "$GITHUB_REPOSITORY" \
            -n austraits-k-five-flora-exclusion-support-v0-1 -D build/flora-exclusion
          gh run download 38673955087 -R "$GITHUB_REPOSITORY" \
            -n austraits-k-shared-taxon-pair-support-v0-1 -D build/original
          test -f build/flora-exclusion/source_support_excluding_five_floras.json
          test -f build/original/shared_taxon_pair_support.json
      - name: Test native K state source medians, frozen 283 cohort and synthetic 25-species parity arithmetic
        run: |
          python -m py_compile scripts/analysis/run_austraits_k_five_flora_exclusion_batch_v0_1.py
          python tests/test_austraits_k_five_flora_exclusion_batch_v0_1.py \
            --nonflora-support build/flora-exclusion/source_support_excluding_five_floras.json \
            --original-pair-support build/original/shared_taxon_pair_support.json \
            --design data/austraits_k_exclude_five_electronic_floras_support_v0_1.json
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::Rcpp
            any::jsonlite
            any::phytools
      - name: Pin existing V.PhyloMaker2 and parse native four-K estimator
        run: |
          Rscript -e "parse(file='scripts/analysis/fit_austraits_k_five_flora_exclusion_pairs_v0_1.R')"
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Acquire SHA256-verified original AusTraits v7 compilation and source-native measurement unit dictionary
        run: |
          curl -L --fail --retry 4 --retry-delay 10 \
            -o build/source/austraits.parquet \
            https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail -o build/source/traits.yml \
            https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Select small exception and large comparator ONLY by source support, not original K values
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/flora-exclusion/source_support_excluding_five_floras.json'))
          o=json.load(open('build/original/shared_taxon_pair_support.json'))
          ref={(r['family'],r['trait_A'],r['trait_B']):r
             for r in o['family_trait_pair_support'] if r['qualifies_20_common_species']}
          selected=[]
          for fam,a,b,n in [('Casuarinaceae','leaf_length','seed_dry_mass',31),
                             ('Fabaceae','leaf_length','seed_length',1174)]:
              rr=[r for r in d['cross_organ_nonflora_supported_family_trait_pairs']
                  if (r['family'],r['trait_A'],r['trait_B'])==(fam,a,b)]
              assert len(rr)==1 and rr[0]['n_nonflora_positive_median_shared_species']==n
              orig=ref[(fam,a,b)]
              selected.append({**rr[0],
                 'n_original_A':orig['n_original_A'],
                 'n_original_B':orig['n_original_B']})
          open('build/batch/smoke.json','w').write(json.dumps(selected))
          print('PASS: 31 and 1174 species nonflora support pre-selected without K direction')
          PY
      - name: Compute four within-pair same-tip native K response values before/after five electronic floras
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/analysis/run_austraits_k_five_flora_exclusion_batch_v0_1.py \
            --batch-json build/batch/smoke.json \
            --nonflora-support build/flora-exclusion/source_support_excluding_five_floras.json \
            --original-pair-support build/original/shared_taxon_pair_support.json \
            --parquet build/source/austraits.parquet \
            --traits-yml build/source/traits.yml \
            --design data/austraits_k_exclude_five_electronic_floras_support_v0_1.json \
            --r-script scripts/analysis/fit_austraits_k_five_flora_exclusion_pairs_v0_1.R \
            --out build/out/smoke_nonflora_pair_K.json
          python - <<'PY'
          import json
          x=json.load(open('build/out/smoke_nonflora_pair_K.json'))
          assert x['status']=='AUSTRAITS_K_FIVE_FLORA_EXCLUSION_PAIR_BATCH_COMPLETE'
          assert len(x['pairs'])==2
          assert all(p['axes']['S3']['status']=='PASS' for p in x['pairs'])
          assert x['NOT_independent_primary_measurement_validation']
          assert x['no_species_observation_IDs_or_raw_trait_measurements_persisted']
          print('PASS: source-excluded S3 native tree K on two reproducible original original taxon supports')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-k-five-flora-exclusion-smoke-v0-1
          path: build/out/smoke_nonflora_pair_K.json
          retention-days: 30
