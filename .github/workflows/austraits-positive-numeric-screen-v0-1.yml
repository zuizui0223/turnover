name: AusTraits positive numeric matched-core screen v0.1

on:
  push:
    branches:
      - replication/austraits-memory-context-v0-1
    paths:
      - '.github/workflows/austraits-positive-numeric-screen-v0-1.yml'
      - 'scripts/analysis/screen_austraits_positive_numeric_core_v0_1.py'
      - 'data/austraits_trait_rank_portability_scale_v0_2.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: austraits-final-core-v0-6-5-4
          path: build/final
          repository: zuizui0223/turnover
          run-id: 37560915567
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --index-url https://pypi.org/simple duckdb pyyaml
      - name: Validate prospective scale contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/austraits_trait_rank_portability_scale_v0_2.json'))
          assert d['status']=='FROZEN_BEFORE_AUSTRAITS_TEMPORAL_MEMORY_EFFECT_OPENING'
          assert d['austraits_memory_effects_opened'] is False
          PY
      - name: Download pinned source and config
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 -o build/source/austraits.parquet             https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
          curl -L --fail -o build/source/traits.yml             https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - name: Build matched positive-numeric core before rho
        run: |
          mkdir -p build/screen
          python scripts/analysis/screen_austraits_positive_numeric_core_v0_1.py             --parquet build/source/austraits.parquet             --traits-yml build/source/traits.yml             --core-table build/final/core/core_systems.csv             --out build/screen/result.json             --table-out build/screen/positive_numeric_screen.csv             --matched-core-out build/screen/matched_positive_numeric_core.csv
          cat build/screen/result.json
          python - <<'PY'
          import json
          x=json.load(open('build/screen/result.json'))
          assert x['outcome_blind'] is True
          assert x['austraits_memory_effects_opened'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-positive-numeric-screen-v0-1
          path: build/screen/
          retention-days: 30
