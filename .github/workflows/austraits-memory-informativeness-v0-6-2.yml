name: AusTraits memory temporal informativeness v0.6.2

on:
  pull_request:
    paths:
      - '.triggers/austraits-memory-informativeness-v0-6-4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen geometry preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/geometry
          gh run download 37128923077 -R "$GITHUB_REPOSITORY" -n austraits-memory-geometry-prep-v0-6-3 -D build/geometry
          test -f build/geometry/groups.csv
          test -f build/geometry/systems.csv
      - name: Download pinned trait config
        run: |
          curl -L --fail -o build/traits.yml             https://raw.githubusercontent.com/traitecoevo/austraits.build/7fbf6c8169a7eaf9a184e48c171cb63f2b1e2b8c/config/traits.yml
      - id: matrix
        name: Build deterministic balanced geometry batches
        run: |
          python - <<'PY'
          import base64,csv,json,os,yaml
          cfg=yaml.safe_load(open('build/traits.yml'))['traits']['elements']
          unit={k:('' if v.get('units') is None else str(v.get('units')).strip()) for k,v in cfg.items()}
          rows=list(csv.DictReader(open('build/geometry/groups.csv',newline='')))
          assert len(rows)==1442,len(rows)
          systems=[]
          for i,r in enumerate(sorted(rows,key=lambda z:(z['canonical_family'],z['canonical_trait_name'])),1):
              systems.append({
                'geometry_id':f'G{i:04d}',
                'geometry_hash':r['geometry_hash'],
                'family':r['canonical_family'],
                'trait_name':r['canonical_trait_name'],
                'config_type':r['config_type'],
                'expected_unit':unit[r['canonical_trait_name']],
                'n_input_species':int(r['n_input_species']),
                'n_prune':int(r['n_prune']),
                'n_bind':int(r['n_bind']),
                '_weight':int(r['n_input_species'])**2 + int(r['n_prune'])**2
              })
          nb=128
          bins=[{'weight':0,'systems':[]} for _ in range(nb)]
          for r in sorted(systems,key=lambda z:(-z['_weight'],z['family'],z['trait_name'])):
              k=min(range(nb),key=lambda i:(bins[i]['weight'],i))
              x={q:r[q] for q in ['geometry_id','geometry_hash','family','trait_name','config_type','expected_unit','n_input_species','n_prune','n_bind']}
              bins[k]['systems'].append(x); bins[k]['weight']+=r['_weight']
          include=[]
          for i,b in enumerate(bins,1):
              raw=json.dumps(b['systems'],separators=(',',':')).encode()
              include.append({
                'batch_id':f'B{i:03d}',
                'systems_b64':base64.b64encode(raw).decode(),
                'n_geometries':len(b['systems']),
                'weight':b['weight']
              })
          assert min(x['n_geometries'] for x in include)>=1
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          json.dump({
            'version':'v0.6.2','n_unique_geometries':len(systems),'n_batches':nb,
            'min_batch_geometries':min(x['n_geometries'] for x in include),
            'max_batch_geometries':max(x['n_geometries'] for x in include),
            'min_batch_weight':min(x['weight'] for x in include),
            'max_batch_weight':max(x['weight'] for x in include),
            'austraits_memory_effects_opened':False
          },open('build/geometry/batch_summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-memory-informativeness-prepare-v0-6-2
          path: build/geometry/batch_summary.json

  simulate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ape
      - name: Install Python runtime
        run: pip install duckdb
      - name: Pin V.PhyloMaker2
        run: |
          mkdir -p build
          git clone --filter=blob:none https://github.com/jinyizju/V.PhyloMaker2.git build/V.PhyloMaker2
          git -C build/V.PhyloMaker2 checkout 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          R CMD INSTALL build/V.PhyloMaker2
      - name: Download exact AusTraits source
        run: |
          mkdir -p build/source
          curl -L --fail --retry 4 --retry-delay 10 -o build/source/austraits.parquet             https://github.com/traitecoevo/austraits.build/releases/download/v7.0.0/austraits-7.0.0-flattened.parquet
          echo "5825d326c8236f5c86e9793d152d6ac5f83c1287a14255b6cf2b77ae2e804c99  build/source/austraits.parquet" | sha256sum -c -
      - name: Validate inherited recovery contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/austraits_memory_informativeness_v0_6.json'))
          c=json.load(open('data/austraits_memory_geometry_dedup_v0_6_1.json'))
          b=json.load(open('data/bien_informativeness_design_v0_4.json'))
          e=json.load(open('data/bien_informativeness_execution_v0_4_2.json'))
          assert d['status']=='FROZEN_BEFORE_AUSTRAITS_INFORMATIVENESS_RESULT'
          assert d['inherited_scientific_contract']['benchmark_delta_rho']==0.15
          assert d['inherited_scientific_contract']['median_absolute_recovery_error_max']==0.10
          assert d['inherited_scientific_contract']['directional_recovery_min']==0.80
          assert d['inherited_scientific_contract']['valid_replicate_fraction_min']==0.90
          assert d['exact_efficiency_rules']['axis_order'].startswith('Evaluate prune-only first')
          assert d['exact_efficiency_rules']['no_pair_subsampling'] is True
          assert c['canonical_representative'].startswith('lexicographically smallest')
          assert b['continuous_scalar_generator']['evaluation_replicates']==1000
          assert e['lambda_search']['pilot_replicates_per_value']==200
          PY
      - name: Decode batch and run geometries
        env:
          SYSTEMS_B64: ${{ matrix.systems_b64 }}
        run: |
          mkdir -p build/batch build/species build/results
          python - <<'PY'
          import base64,os
          open('build/batch/systems.json','wb').write(base64.b64decode(os.environ['SYSTEMS_B64']))
          PY
          python scripts/analysis/run_austraits_memory_informativeness_batch_v0_6_2.py             --batch-json build/batch/systems.json             --parquet build/source/austraits.parquet             --out-dir build/results             --species-dir build/species             --r-script scripts/analysis/run_austraits_memory_informativeness_geometry_v0_6_2.R
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-memory-info-${{ matrix.batch_id }}
          path: build/results/*.json
          retention-days: 30

  aggregate:
    needs: simulate
    if: always() && needs.simulate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: austraits-memory-info-B*
          path: build/all-results
          merge-multiple: true
      - name: Download frozen geometry-system map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/geometry
          gh run download 37128923077 -R "$GITHUB_REPOSITORY" -n austraits-memory-geometry-prep-v0-6-3 -D build/geometry
      - name: Aggregate geometry decisions and final crossed core
        run: |
          mkdir -p build/austraits_memory_informativeness_v0_6 build/austraits_memory_crossed_core_v0_6
          python scripts/analysis/aggregate_austraits_memory_informativeness_v0_6_2.py             --systems-map build/geometry/systems.csv             --geometry-dir build/all-results             --out build/austraits_memory_informativeness_v0_6/result.json             --table-out build/austraits_memory_informativeness_v0_6/temporal_informativeness.csv             --core-out build/austraits_memory_crossed_core_v0_6/result.json             --core-table-out build/austraits_memory_crossed_core_v0_6/core_systems.csv
      - name: Enforce pre-outcome firewall
        run: |
          python - <<'PY'
          import json
          i=json.load(open('build/austraits_memory_informativeness_v0_6/result.json'))
          c=json.load(open('build/austraits_memory_crossed_core_v0_6/result.json'))
          assert i['outcome_blind'] is True
          assert i['austraits_memory_effects_opened'] is False
          assert i['n_candidate_systems']==1463
          assert i['n_unique_geometries']==1442
          assert c['outcome_blind'] is True
          assert c['austraits_memory_effects_opened'] is False
          assert c['status'] in {'AUSTRAITS_MEMORY_CROSSED_CORE_PASS','HOLD_AUSTRAITS_MEMORY_CROSSED_CORE'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austraits-memory-informativeness-v0-6
          path: |
            build/austraits_memory_informativeness_v0_6/
            build/austraits_memory_crossed_core_v0_6/
