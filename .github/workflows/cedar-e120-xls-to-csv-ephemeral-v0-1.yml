name: Cedar Creek E120 168-plot bonus XLS exact-byte structured export
on:
  push:
    branches: [analysis/cedar-e120-independent-biomass-fg-source-20261115]
    paths:
      - .github/workflows/cedar-e120-xls-to-csv-ephemeral-v0-1.yml
  pull_request:
    paths:
      - .github/workflows/cedar-e120-xls-to-csv-ephemeral-v0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed original Excel 97/2003 reader
        run: python3 -m pip install -q xlrd==2.0.1
      - name: Convert only exact-publication source XLS to structured CSV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import xlrd,csv,hashlib,json
          root=Path('build/cedar_e120_esa_public_source_v0_1')
          root.mkdir(parents=True,exist_ok=True)
          filenames={'DataBonus-Student.xls':'a86755544d75fabb85f4979303efcada96683ae60c0bc3bdb60c5d4c739d7476',
                     'Species_List.xls':'58beb1bdb61e4fa011c7df47b81f1369efba16c122a7862bc53173eaae555087'}
          result=[]
          for name,expected in filenames.items():
              url='https://www.esa.org/tiee/vol/v2/issues/data_sets/cedar_creek/data/'+name
              request=Request(url,headers={'User-Agent':'turnover-cedar-raw-source-conversion/0.1'})
              with urlopen(request,timeout=100) as resp:
                  b=resp.read(8000000)
              digest=hashlib.sha256(b).hexdigest()
              if digest != expected:raise ValueError(f'pub XLS bytes changed: {name}')
              book=xlrd.open_workbook(file_contents=b)
              sheet=book.sheet_by_index(0)
              outname='e120_bonus_table_all_rows.csv' if name.startswith('DataBonus') else 'e120_species_list_all_rows.csv'
              with (root/outname).open('w',newline='',encoding='utf-8') as f:
                  writer=csv.writer(f)
                  for i in range(sheet.nrows):
                      writer.writerow([sheet.cell_value(i,j) for j in range(sheet.ncols)])
              meta={'original_xls_name':name,'source_sha256':digest,'source_bytes':len(b),
                    'csv_export_name':outname,'sheets':book.sheet_names(),'source_rows':sheet.nrows,
                    'source_columns':sheet.ncols,'csv_sha256':hashlib.sha256((root/outname).read_bytes()).hexdigest()}
              result.append(meta)
              print('CEDAR_XLS_EXACT_CONVERSION',json.dumps(meta,sort_keys=True))
          (root/'MANIFEST.json').write_text(json.dumps({'files':result,
              'source_url':'https://www.esa.org/tiee/vol/v2/issues/data_sets/cedar_creek/data.html',
              'license_status':'ESA TIEE 2004 teaching republication; retain attribution and avoid treating as independent study',
              'purpose':'Research-only source structuring, NOT ecological outcomes'},indent=2)+'\n')
          PY
      - name: Retain ephemeral transformed source for scientific validation
        uses: actions/upload-artifact@v4
        with:
          name: cedar-e120-168plot-teaching-csv-research-temporary
          path: build/cedar_e120_esa_public_source_v0_1/
          retention-days: 7
