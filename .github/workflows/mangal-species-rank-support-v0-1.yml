name: Mangal species-rank support v0.1

on:
  pull_request:
    paths:
      - 'data/mangal_species_rank_support_design_v0_1.json'
      - 'results/mangal_semantic_adjudication_v0_2/result.json'
      - 'scripts/analysis/audit_mangal_species_rank_support_v0_1.py'
      - '.github/workflows/mangal-species-rank-support-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate species-rank gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/mangal_species_rank_support_design_v0_1.json'))
          assert d['status']=='FROZEN_BEFORE_MANGAL_TAXON_NAME_AND_RANK_OPENING'
          assert set(d['forbidden_endpoints'])=={'interaction','trait','environment'}
          q=d['qualification']
          assert q['minimum_georeferenced_networks']==5
          assert q['minimum_unique_species_rank_taxa']==20
          assert q['minimum_repeated_species_rank_taxa']==10
          assert q['minimum_qualifying_programmes']==12
          assert d['rank_rule'].startswith('Only taxonomy.rank exactly equal to species')
          assert d['no_posthoc_relaxation'] is True
          PY

      - name: Run name/rank support audit
        run: |
          mkdir -p build/mangal_species_rank_support_v0_1/species
          python scripts/analysis/audit_mangal_species_rank_support_v0_1.py             --out build/mangal_species_rank_support_v0_1/result.json             --species-dir build/mangal_species_rank_support_v0_1/species

      - name: Validate interaction firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/mangal_species_rank_support_v0_1/result.json'))
          assert x['outcome_blind'] is True
          assert x['endpoints_called']==['network','node']
          assert x['forbidden_endpoints_called']==[]
          assert x['interaction_edges_opened'] is False
          assert x['interaction_types_opened'] is False
          assert x['taxon_names_opened'] is True
          assert x['taxonomy_ranks_opened'] is True
          assert x['status'] in {'MANGAL_SPECIES_RANK_SUPPORT_PASS','HOLD_MANGAL_SPECIES_RANK_SUPPORT'}
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mangal-species-rank-support-v0-1
          path: build/mangal_species_rank_support_v0_1/
