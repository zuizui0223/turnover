name: DivResource 2013 fixed disjoint pool original B NDE transfer
on:
  push:
    branches: [analysis/divresource-pool-transfer-20261126]
    paths:
      - scripts/analysis/divresource_2013_pool_transfer_core.py
      - scripts/analysis/divresource_2013_source_adapter.py
      - .github/workflows/divresource-2013-pool-transfer.yml
  workflow_dispatch:
jobs:
  original-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - name: Known truth and source cohort synthetic gate
        run: python scripts/analysis/divresource_2013_pool_transfer_core.py --selftest
      - name: Verify original S5 S6 identity and run fixed B NDE pool transfer
        run: python scripts/analysis/divresource_2013_source_adapter.py
      - uses: actions/upload-artifact@v4
        with:
          name: divresource-2013-fixed-pool-transfer-aggregate
          path: results/divresource_2013_pool_transfer_v0_1.json
          if-no-files-found: error
